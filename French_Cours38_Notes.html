<script>



let rate = 1, frVoice = null;
function pickVoice(){
  const v = speechSynthesis.getVoices();
  frVoice = v.find(x=>/fr[-_]FR/i.test(x.lang)) || v.find(x=>/^fr/i.test(x.lang)) || null;
  const s = document.getElementById('voiceStatus');
  if (frVoice) s.textContent = "\u{1F50A} " + frVoice.name;
  else if (v.length) s.textContent = "⚠ no French voice — see Cours 1 page";
}
speechSynthesis.onvoiceschanged = pickVoice; pickVoice();
function utter(text){
  const u = new SpeechSynthesisUtterance(String(text).replace(/\s+([!?])/g,'$1').replace(/___/g,''));
  u.lang='fr-FR'; if(frVoice) u.voice=frVoice; u.rate=(r||rate); return u;
}
function speak(text, r){ speechSynthesis.cancel(); speechSynthesis.speak(utter(text)); }

function makeRow(fr, ph, en){
  const row=document.createElement('div'); row.className='row';
  const btn=document.createElement('button'); btn.className='play'; btn.textContent='▶';
  const txt=document.createElement('div'); txt.className='txt';
  txt.innerHTML='<div class="fr"></div>'+(ph?'<div class="ph"></div>':'')+(en?'<div class="en"></div>':'');
  txt.querySelector('.fr').textContent=fr;
  if(ph) txt.querySelector('.ph').textContent=ph;
  if(en) txt.querySelector('.en').textContent=en;
  btn.onclick=()=>speak(fr); txt.querySelector('.fr').onclick=()=>speak(fr);
  row.appendChild(btn); row.appendChild(txt);
  return row;
}

const content = document.getElementById('content');
const GLOBAL_VOCAB = [];
/* ===== helpers for this page ===== */
function h2(t){ const e=document.createElement('h2'); e.textContent=t; content.appendChild(e); }
function h3(t){ const e=document.createElement('h3'); e.className='sub2'; e.textContent=t; content.appendChild(e); }
function lead(t){ const e=document.createElement('p'); e.className='lead'; e.innerHTML=t; content.appendChild(e); }
function note(t){ const e=document.createElement('div'); e.className='note'; e.innerHTML=t; content.appendChild(e); }
function ex(t){ const e=document.createElement('div'); e.className='example'; e.innerHTML=t; content.appendChild(e); }
function warn(t){ const e=document.createElement('div'); e.className='warn'; e.innerHTML=t; content.appendChild(e); }
function src(t){ const e=document.createElement('div'); e.className='source'; e.innerHTML=t; content.appendChild(e); }
function rows(list){ list.forEach(([fr,ph,en])=>{ content.appendChild(makeRow(fr,ph,en)); GLOBAL_VOCAB.push({fr:fr,en:en}); }); }
function grid(list){
  const g=document.createElement('div'); g.className='grid';
  list.forEach(([fr,ph])=>{
    const c=document.createElement('div'); c.className='cell';
    c.innerHTML='<div class="fr"></div><div class="ph"></div>';
    c.querySelector('.fr').innerHTML=fr; c.querySelector('.ph').innerHTML=ph;
    const plain=String(fr).replace(/<[^>]*>/g,'').replace(/\s*—.*$/,'').trim();
    c.onclick=()=>speak(plain); g.appendChild(c);
  });
  content.appendChild(g);
}
function table(head, body){
  const t=document.createElement('table'); t.className='conjt';
  let html='<tr>'+head.map(h=>'<th>'+h+'</th>').join('')+'</tr>';
  body.forEach(r=>{ html+='<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>'; });
  t.innerHTML=html; content.appendChild(t);
}
function fill(items){
  items.forEach(it=>{
    const d=document.createElement('div'); d.className='fillrow';
    const s=document.createElement('div'); s.className='sent'; s.innerHTML=it.s;
    const inp=document.createElement('input'); inp.placeholder='...';
    const btn=document.createElement('button'); btn.textContent='Check';
    const fb=document.createElement('div'); fb.className='fb';
    function check(){
      const v=inp.value.trim().toLowerCase().replace(/\s+/g,' ').replace(/[.?!]$/,'');
      const ok=it.a.some(a=>a.toLowerCase()===v);
      if(ok){ fb.className='fb ok'; fb.innerHTML='✓ '+it.a[0]+' — '+it.why; speak(it.a[0]); }
      else { fb.className='fb bad'; fb.innerHTML='✗ Answer: <b>'+it.a[0]+'</b> — '+it.why; }
    }
    btn.onclick=check;
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter') check(); });
    d.appendChild(s);
    const line=document.createElement('div'); line.appendChild(inp); line.appendChild(btn);
    d.appendChild(line);
    if(it.en){ const t=document.createElement('div'); t.className='en'; t.style.marginTop='6px'; t.textContent=it.en; d.appendChild(t); }
    d.appendChild(fb);
    content.appendChild(d);
  });
}
function mcq(items){
  items.forEach(it=>{
    const d=document.createElement('div'); d.className='riddle';
    const p=document.createElement('div'); p.className='prompt'; p.innerHTML=it.q;
    const b=document.createElement('div'); b.className='btns';
    const fb=document.createElement('div'); fb.className='fb';
    it.opts.forEach((o,i)=>{
      const btn=document.createElement('button'); btn.textContent=o;
      btn.onclick=()=>{
        if(i===it.a){ fb.className='fb ok'; fb.innerHTML='✓ '+o+' — '+it.why; speak(o); }
        else { fb.className='fb bad'; fb.innerHTML='✗ The answer is <b>'+it.opts[it.a]+'</b> — '+it.why; }
      };
      b.appendChild(btn);
    });
    d.appendChild(p); d.appendChild(b); d.appendChild(fb);
    content.appendChild(d);
  });
}


/* ===== 1 ===== */
function fillx(list){ fill(list.map(x=>({s:x[0], a:[x[1]], en:x[2]||'', why:x[3]||('Réponse : <b>'+x[1]+'</b>')}))); }
function mcqx(list){ mcq(list.map(x=>({q:x[0], opts:x[1], a:x[2], why:x[3]||''}))); }

function read(paras){
  const d=document.createElement('div'); d.className='reading';
  paras.forEach(t=>{
    const el=document.createElement('p'); el.innerHTML=t; el.style.cursor='pointer';
    const plain=String(t).replace(/<[^>]*>/g,'');
    el.onclick=()=>speak(plain);
    d.appendChild(el);
  });
  content.appendChild(d);
}

function dict(items){
  items.forEach((it,n)=>{
    const d=document.createElement('div'); d.className='fillrow';
    const top=document.createElement('div'); top.className='sent';
    top.innerHTML='<b>'+(n+1)+'.</b> Écoutez, puis écrivez ce que vous entendez. <i>(Listen, then write what you hear.)</i>';
    const bar=document.createElement('div'); bar.style.cssText='display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0';
    const pb=document.createElement('button'); pb.textContent='▶ Écouter'; pb.onclick=()=>speak(it.fr);
    const sb=document.createElement('button'); sb.textContent='▶ Lentement'; sb.onclick=()=>speak(it.fr,0.55);
    const inp=document.createElement('input'); inp.placeholder='Écrivez ici…'; inp.style.flex='1';
    const cb=document.createElement('button'); cb.textContent='Vérifier';
    const fb=document.createElement('div'); fb.className='fb';
    function norm(s){ return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim(); }
    cb.onclick=()=>{
      if(norm(inp.value)===norm(it.fr)){ fb.className='fb ok'; fb.innerHTML='✓ <b>'+it.fr+'</b><br>'+(it.en||'')+(it.why?'<br><i>'+it.why+'</i>':''); }
      else { fb.className='fb bad'; fb.innerHTML='✗ Réponse : <b>'+it.fr+'</b><br>'+(it.en||'')+(it.why?'<br><i>'+it.why+'</i>':''); }
    };
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter') cb.onclick(); });
    bar.appendChild(pb); bar.appendChild(sb); bar.appendChild(inp); bar.appendChild(cb);
    d.appendChild(top); d.appendChild(bar); d.appendChild(fb);
    content.appendChild(d);
  });
}



h2('Before you start — the three things this lesson assumes');
lead("This page assumes you are learning French for the first time, so nothing below is taken for granted. If any of these three ideas is new, read the box — it takes two minutes and the rest of the page will then make sense.");
ex("<b>1 · An ARTICLE is the little word in front of a noun.</b><br><br>English has <i>the</i>, <i>a</i>, <i>an</i>. French has more of them, because its articles change shape:<br><br>· <b>le</b> = the (masculine) — <i>le livre</i>, the book<br>· <b>la</b> = the (feminine) — <i>la maison</i>, the house<br>· <b>l’</b> = the (before a vowel) — <i>l’école</i>, the school<br>· <b>les</b> = the (plural) — <i>les amis</i>, the friends<br><br>You can’t leave it out. French almost never says a bare noun.");
ex("<b>2 · Every French noun is MASCULINE or FEMININE.</b><br><br>It has nothing to do with male and female. <i>Le livre</i> (book) is masculine; <i>la table</i> (table) is feminine. It is just a label the word carries, like a filing category.<br><br>It matters here because <b>the masculine and feminine forms contract differently</b>. So if you don’t know a noun’s gender, you cannot choose the right form.<br><br><b>So from now on, never learn a noun alone.</b> Don’t learn <i>maison</i> — learn <b>la maison</b>.");
ex("<b>3 · A VERB is the action word, and the SUBJECT is who does it.</b><br><br><i><b>Je</b> vais au cinéma.</i> — <b>je</b> (I) is the subject, <b>vais</b> (go) is the verb.<br><br>In Part 3 we’ll also need the <b>object</b>: the thing the action lands on. In <i>I watch <b>the film</b></i>, the film is the object. That’s the whole idea behind COD pronouns, and we’ll build it up slowly there.");
note("Those three — <b>article</b>, <b>gender</b>, <b>subject/verb/object</b> — are the whole toolkit for today. Everything else is built in front of you on this page.");

h2('What this lesson is about');
lead("Today’s class covered <b>two separate things</b> that happen to use the same small words. Here is the shape of the whole lesson before we start:");
ex("<b>PART 1 — the little words <i>à</i> and <i>de</i> in front of <i>le / la / les</i>.</b><br>They are not allowed to just sit next to each other. They fuse. <i>à + le</i> becomes <b>au</b>. That gives you eight forms to know.<br><br><b>PART 2 — which of the two you pick when you talk about a place.</b><br>The slide calls this <i>Articles used with places</i>. The answer is not about the place at all — it is about the <b>verb</b>.<br><br><b>PART 3 — the COD pronouns.</b><br>A completely different topic. How to stop repeating a noun and say <i>it / him / her / them</i> instead — and where that word goes in the sentence, which is <u>not</u> where English puts it.");
note("<b>Why they were taught together.</b> They weren’t, really — they are two different PDFs. But they do connect: in Part 2 you learn that <i>aller</i> takes <b>à</b> and <i>venir</i> takes <b>de</b>. In a later class that same pair becomes the pronouns <b>y</b> and <b>en</b>. So Part 2 is quietly laying the ground for the lesson after the COD one.");

h2('PART 1 · à and de in front of an article');

h3('Step 1 — the problem French is solving');
lead("In English you can stack small words freely: <i>to the shop</i>, <i>of the car</i>. French cannot. When <b>à</b> or <b>de</b> lands directly in front of <b>le</b> or <b>les</b>, French refuses to say the two words separately and squashes them into one. This is called a <b>contraction</b> — <i>une contraction</i>.");
ex("You want to say <b>I’m going to the cinema</b>.<br><br>The raw pieces are <i>je vais</i> + <i>à</i> + <i>le cinéma</i>.<br>Put together that would be <s>je vais à le cinéma</s> — and no French speaker has ever said that.<br><br>The <i>à</i> and the <i>le</i> fuse: <b>je vais au cinéma</b>.");
note("This is not a style choice you can ignore. <i>À le</i> and <i>de le</i> are simply <b>not French</b>. Writing them in the TCF is a guaranteed mark lost.");

h3('Step 2 — the eight forms');
lead("Four kinds of noun, two prepositions, eight results. This is the table from the slide.");
table(['The noun is…','with <b>de</b> (from / of)','with <b>à</b> (to / at / in)'],[
 ['<b>masculine</b> — le livre','de + le → <b>du</b>','à + le → <b>au</b>'],
 ['<b>feminine</b> — la maison','de + la → <b>de la</b>','à + la → <b>à la</b>'],
 ['<b>starts with a vowel</b> — l’école','de + l’ → <b>de l’</b>','à + l’ → <b>à l’</b>'],
 ['<b>plural</b> — les amis','de + les → <b>des</b>','à + les → <b>aux</b>']
]);
warn("<b>Only four of these eight are real fusions.</b> <b>du</b>, <b>des</b>, <b>au</b> and <b>aux</b> are single words. The other four — <i>de la</i>, <i>de l’</i>, <i>à la</i>, <i>à l’</i> — stay as <u>two separate words</u>. Learners very often write “dela” or “ala”. Those do not exist.");
note("<b>Why does <i>la</i> escape?</b> Because <i>la</i> ends in a vowel sound, so there is nothing awkward about saying <i>à la</i> — the mouth flows straight through. <i>À le</i> forces two tight vowels together, which is exactly what French spends most of its energy avoiding. The same instinct is behind elision (<i>l’école</i>) and liaison.");

h3('Step 3 — how they sound');
lead("Click any line to hear it. The middle column is a plain English-style respelling, not phonetic symbols.");
rows([
 ['du','dü — tight lips, like the “u” in French <i>tu</i>','of the / from the  (masculine)'],
 ['de la','deu la','of the / from the  (feminine)'],
 ['de l’','deu l','of the / from the  (before a vowel)'],
 ['des','day','of the / from the  (plural)'],
 ['au','oh','to the / at the  (masculine)'],
 ['à la','a la','to the / at the  (feminine)'],
 ['à l’','a l','to the / at the  (before a vowel)'],
 ['aux','oh','to the / at the  (plural)']
]);
warn("<b>au</b> and <b>aux</b> sound <u>identical</u> — both are just “oh”. The x is silent. So when you are listening, the preposition will not tell you singular or plural; only the noun after it will. <i>au cinéma</i> (one cinema) vs <i>aux toilettes</i> (plural word).");
note("<b>des</b> is “day”, exactly like <b>les</b> but with a d. Both have a silent s — <u>unless</u> the next word starts with a vowel.");

h3('Step 4 — the one time the silent letter wakes up');
lead("French final consonants are normally silent. But when the next word starts with a vowel sound, the consonant jumps across and joins it. This is called <b>la liaison</b>, and with <i>aux</i> and <i>des</i> the s is pronounced <b>z</b>.");
rows([
 ['aux enfants','oh-zan-FAN','to the children'],
 ['des amis','day-za-MI','of the friends'],
 ['aux États-Unis','oh-zay-ta-zü-NI','to the United States'],
 ['des hôtels','day-zo-TEL','of the hotels'],
 ['aux toilettes','oh twa-LET','to the toilet  — no liaison, t is a consonant']
]);
note("Liaison isn’t decoration. Without it, <i>aux amis</i> comes out as two separate blobs and sounds foreign. French wants one unbroken stream of sound per phrase.");

h2('PART 2 · Which one do you use with a place?');

h3('Step 1 — the thing the slide shows but never says');
lead("The slide puts <i>ALLER, HABITER, TRAVAILLER, ÊTRE, VIVRE</i> in one column and <i>VENIR, ARRIVER, RENTRER</i> in another. It never explains why. Here is the why, and it is the single most useful sentence on this page:");
ex("<b>The place does not choose the preposition. The VERB chooses it.</b><br><br>Ask yourself one question: <u>which way is the action pointing?</u><br><br>· Pointing <b>towards</b> the place, or sitting <b>inside</b> it → <b>à</b> (au / à la / aux / à l’)<br>· Pointing <b>away from</b> the place → <b>de</b> (du / de la / des / de l’)");
ex("Watch the same office, same speaker, two verbs:<br><br><i>Je vais <b>au</b> bureau.</i> — I’m going <b>to</b> the office.<br><i>Je viens <b>du</b> bureau.</i> — I’m coming <b>from</b> the office.<br><br>Nothing about <i>le bureau</i> changed. Only the direction of travel did, and the preposition flipped with it.");

h3('Step 2 — the two verb families');
table(['Direction','Verbs','English','Masc','Fem','Plural','Vowel'],[
 ['<b>to / at / in</b>','aller, habiter, travailler, être, vivre, rester','to go, to live, to work, to be, to live, to stay','<b>au</b>','<b>à la</b>','<b>aux</b>','<b>à l’</b>'],
 ['<b>from / out of</b>','venir, arriver, rentrer, sortir, partir','to come, to arrive, to return, to go out, to leave','<b>du</b>','<b>de la</b>','<b>des</b>','<b>de l’</b>']
]);
note("Notice the first family mixes <b>movement</b> (aller) with <b>no movement at all</b> (être, habiter). That’s fine — <b>à</b> covers both “going to” and “being at”. English does the same with <i>at</i> and <i>to</i> being different words; French uses one.");

h3('Step 3 — a third job for “de” that has nothing to do with places');
lead("The slide heading says <i>places <b>& other forms</b></i>, and this is the “other forms” part. <b>de</b> also glues two nouns together to show possession or belonging. Where English uses <i>’s</i> or <i>of</i>, French always uses <b>de</b>.");
rows([
 ['les clés de la voiture','lay clay deu la vwa-TÜR','the car keys  (literally: the keys of the car)'],
 ['la porte du garage','la port dü ga-RAHZH','the garage door'],
 ['le prof des enfants','leu prof day-zan-FAN','the children’s teacher'],
 ['les enfants de Victor','lay-zan-fan deu Vik-TOR','Victor’s children']
]);
warn("French has <b>no apostrophe-s</b>. You can never say “Victor’s children” word for word. You must flip it round: <i>les enfants <b>de</b> Victor</i> — “the children of Victor”. Every single time.");
note("Before a <b>name</b> there is no article, so there is nothing to contract: <i>de Victor</i>, <i>de Marie</i>. Never “du Victor”.");

h2('PART 3 · The COD pronouns');

h3('Step 1 — first, what is an “object”?');
lead("Forget French for a moment. Look at an English sentence:");
ex("<b>I watch the film.</b><br><br>· <b>I</b> — the one doing it. This is the <b>subject</b>.<br>· <b>watch</b> — the action. This is the <b>verb</b>.<br>· <b>the film</b> — the thing the action lands on. This is the <b>object</b>.<br><br>The action goes <u>straight</u> from the verb onto the film. Nothing sits in between. That is why it is called a <b>direct</b> object.");
ex("Now one where something <u>does</u> sit in between:<br><br><b>I speak to my brother.</b><br><br>The action doesn’t land on my brother directly — it travels to him through the little word <b>to</b>. That makes him an <b>indirect</b> object.");
note("French has a name for each:<br><br>· <b>COD</b> = <i>complément d’objet <b>direct</b></i> — no preposition in the way<br>· <b>COI</b> = <i>complément d’objet <b>indirect</b></i> — a preposition (<b>à</b>) in the way<br><br>Today’s slide is COD. They matter because <b>each one has its own set of pronouns</b>, and they are not interchangeable.");

h3('Step 2 — the test the teacher gave you');
lead("Here is how you tell them apart, and it works every time. Say the verb, then immediately ask <b>qui ?</b> (who?) or <b>quoi ?</b> (what?).");
ex("<i>Je regarde le film.</i> → Je regarde <b>quoi</b> ? → <i>le film</i>. The answer came back with no preposition attached. <b>COD.</b><br><br><i>Je parle à mon frère.</i> → Je parle <b>à qui</b> ? → you had to say <b>à</b> to even ask the question. <b>COI.</b>");
warn("<b>Do the test in French, never in English.</b> The two languages disagree constantly:<br><br>· <i>regarder</i> = to look <u>at</u> → but French is <b>direct</b>: <i>je <b>le</b> regarde</i><br>· <i>écouter</i> = to listen <u>to</u> → direct in French: <i>je <b>l’</b>écoute</i><br>· <i>chercher</i> = to look <u>for</u> → direct in French: <i>je <b>le</b> cherche</i><br>· <i>téléphoner</i> = to phone (direct in English) → but French needs <b>à</b>: <i>je <b>lui</b> téléphone</i><br><br>If you translate the English preposition, you will get it wrong half the time.");

h3('Step 3 — the pronoun list');
lead("This is the left-hand column of the slide. The pronoun replaces a noun you have <b>already mentioned</b>, so you don’t have to say it twice.");
table(['Who / what it replaces','COD pronoun','English','Before a vowel'],[
 ['me','<b>me</b>','me','<b>m’</b>'],
 ['you (one person, informal)','<b>te</b>','you','<b>t’</b>'],
 ['him / it (masculine)','<b>le</b>','him, it','<b>l’</b>'],
 ['her / it (feminine)','<b>la</b>','her, it','<b>l’</b>'],
 ['us','<b>nous</b>','us','no change'],
 ['you (plural or formal)','<b>vous</b>','you','no change'],
 ['them (masculine OR feminine)','<b>les</b>','them','no change'],
 ['each other / oneself','<b>se</b>','each other','<b>s’</b>']
]);
note("<b>The plural has only one form.</b> The slide writes <i>ILS–LES</i> and <i>ELLES–LES</i> on separate lines, and both answers are the same: <b>les</b>. In the singular French distinguishes <i>le</i> and <i>la</i>; in the plural it gives up and uses <b>les</b> for everything.");
note("<b>“L’ + voyelle”</b> — the blue note on the slide. <i>Le</i> and <i>la</i> both shrink to <b>l’</b> when the next word starts with a vowel sound. <i>Je <b>l’</b>adore</i> could be him or her; only the context tells you.");

h3('Step 4 — where the pronoun goes (this is the hard part)');
lead("English puts the pronoun <b>after</b> the verb: <i>I see <u>her</u></i>. French puts it <b>before</b>. Every time. This feels wrong for months and then suddenly feels normal.");
ex("<b>I see her.</b><br>English order: I — see — her<br>French order: <i>Je — <b>la</b> — vois.</i><br><br>The pronoun slides in front of the verb it belongs to. Nothing else moves.");
lead("Now the three cases from the second slide of the class, in a table:");
table(['Tense','Positive','Negative'],[
 ['<b>Présent</b><br><span class="en">now</span>','subject + <b>pronoun</b> + verb<br><i>Il <b>te</b> cherche.</i><br><span class="en">He’s looking for you.</span>','subject + ne + <b>pronoun</b> + verb + pas<br><i>Elle ne <b>vous</b> connaît pas.</i><br><span class="en">She doesn’t know you.</span>'],
 ['<b>Futur proche</b><br><span class="en">going to…</span>','subject + aller + <b>pronoun</b> + infinitive<br><i>Elle va <b>t’</b>inviter.</i><br><span class="en">She’s going to invite you.</span>','subject + ne + aller + pas + <b>pronoun</b> + infinitive<br><i>Elle ne va pas <b>t’</b>inviter.</i><br><span class="en">She isn’t going to invite you.</span>'],
 ['<b>Passé composé</b><br><span class="en">did / have done</span>','subject + <b>pronoun</b> + auxiliary + participle<br><i>Elle <b>m’</b>a cherché.</i><br><span class="en">She looked for me.</span>','subject + ne + <b>pronoun</b> + auxiliary + pas + participle<br><i>Elle ne <b>m’</b>a pas cherché.</i><br><span class="en">She didn’t look for me.</span>']
]);
ex("<b>Why is the futur proche different?</b><br><br>Because there are two verbs in it, and you have to work out <u>which one the object belongs to</u>.<br><br><i>Elle va inviter Mark.</i> — she isn’t “going Mark”, she is <b>inviting</b> Mark. The object belongs to <i>inviter</i>.<br><br>So the pronoun goes in front of <b>inviter</b>, not in front of <i>va</i>: <i>Elle va <b>l’</b>inviter.</i><br><br>Same logic for <i>je veux le voir</i>, <i>je peux le faire</i>, <i>j’aime le regarder</i>. Two verbs → the pronoun hugs the second one.");
warn("In the passé composé the pronoun goes in front of the <b>auxiliary</b> (<i>ai, as, a, avons, avez, ont</i>), not in front of the participle. <i>Je <b>l’</b>ai vu</i> — never “j’ai le vu”. The auxiliary and participle are one unit and the pronoun stands outside it.");

h3('Step 5 — a COD is not only a person');
lead("The second slide, <b>Les pronoms COD 2</b>, makes this point. A direct object can be a thing just as easily as a person. The pronoun doesn’t care who or what it is — it only looks at <b>gender and number</b>.");
rows([
 ['On regarde les photos. → On les regarde.','on reu-GARD lay fo-TO · on lay reu-GARD','We look at the photos. → We look at them.'],
 ['Tu regardes le journal ? → Je le regarde tous les soirs.','tü reu-GARD leu zhoor-NAL · zheu leu reu-GARD too lay SWAR','Do you watch the news? → I watch it every evening.'],
 ['Tu entends les enfants ? → Je les entends jouer.','tü an-TAN lay-zan-FAN · zheu lay-zan-TAN zhoo-AY','Can you hear the children? → I can hear them playing.'],
 ['Tu vas inviter Mark ? → Tu vas l’inviter ?','tü va an-vi-TAY Mark · tü va lan-vi-TAY','Are you going to invite Mark? → Are you going to invite him?']
]);
ex("Look at how each one was chosen:<br><br>· <i>les photos</i> → plural → <b>les</b><br>· <i>le journal</i> → masculine singular → <b>le</b><br>· <i>les enfants</i> → plural → <b>les</b><br>· <i>Mark</i> → masculine singular, and <i>inviter</i> starts with a vowel → <i>le</i> shrinks to <b>l’</b><br><br>You never ask “is it a person?”. You ask “<b>what gender, what number?</b>”");
note("The last one is also the futur proche rule from Step 4 in action: <i>Tu vas <b>l’</b>inviter ?</i> — the pronoun sits between <i>vas</i> and the infinitive.");

h3('Step 6 — one extra rule for the past tense');
lead("This wasn’t on the slide, but it is tested in the TCF and it follows directly from what you’ve just learnt. In the passé composé with <b>avoir</b>, if the COD comes <u>before</u> the verb, the participle has to agree with it.");
ex("<i>J’ai vu <b>Marie</b>.</i> — object is after the verb → participle unchanged: <b>vu</b>.<br><br><i>Je <b>l’</b>ai vu<b>e</b>.</i> — the object is now the pronoun <i>l’</i> = Marie, feminine, and it sits before the verb → add <b>-e</b>.<br><br><i>Je <b>les</b> ai invité<b>s</b>.</i> — masculine plural → add <b>-s</b>.");
note("You almost never hear this. <i>vu / vue / vus / vues</i> all sound identical. It only shows up in writing — which is exactly where it is marked.");

h2('PART 4 · The COI pronouns');

h3('Step 1 — the other half of the pair');
lead("Straight after the COD slide the class moved to <b>Les pronoms COI</b>. This is the second set — the one for objects reached <u>through</u> the preposition <b>à</b>. You already met the idea in Part 3, Step 1; here are the actual words.");
ex("<i>Marc parle <b>à sa sœur</b>.</i> — Marc speaks <b>to</b> his sister.<br>Ask: <i>Marc parle à qui ?</i> — the <b>à</b> is unavoidable, so this is a <b>COI</b>.<br>→ <i>Marc <b>lui</b> parle.</i> — Marc speaks to her.");
note("The slide says COI are used for <b>people only</b>. That is a useful simplification for now: <i>lui</i> and <i>leur</i> do normally refer to people. For a <u>thing</u> after <b>à</b> you use <b>y</b> instead (<i>je pense <b>à</b> mon travail → j’<b>y</b> pense</i>) — that’s the next lesson, not this one.");

h3('Step 2 — the list');
table(['Person','COI pronoun','English','Before a vowel'],[
 ['je','<b>me</b>','to me','<b>m’</b>'],
 ['tu','<b>te</b>','to you','<b>t’</b>'],
 ['il / elle','<b>lui</b>','to him <u>or</u> to her','no change'],
 ['nous','<b>nous</b>','to us','no change'],
 ['vous','<b>vous</b>','to you','no change'],
 ['ils / elles','<b>leur</b>','to them','no change'],
 ['—','<b>se</b>','to each other','<b>s’</b>']
]);
ex("<b>Compare the two lists and notice what actually changed.</b><br><br>· <i>me, te, nous, vous, se</i> — <b>identical</b> in both. Five of the seven are the same word.<br>· Only the third person differs:<br>&nbsp;&nbsp;&nbsp;COD: <b>le / la / les</b><br>&nbsp;&nbsp;&nbsp;COI: <b>lui / leur</b><br><br>So the whole COD-vs-COI problem is really just: <b>le/la/les or lui/leur?</b> Everything else takes care of itself.");
warn("<b>lui</b> is unisex. It means “to him” <u>and</u> “to her”. French makes a gender distinction in the COD (<i>le</i> / <i>la</i>) and then drops it in the COI. There is no logic to rescue here — it is simply how it is.");

rows([

ex("Follow the first one through:<br><br><i>aux touristes</i> — that’s <b>à + les touristes</b>, the contraction from Part 1.<br>The <b>à</b> tells you it’s indirect. The noun is plural.<br>Plural COI → <b>leur</b>.<br>And it goes before the verb: <i>Le guide <b>leur</b> parle.</i><br><br><b>Part 1 and Part 4 just met.</b> You needed the contraction to spot the <i>à</i>, and you needed the <i>à</i> to choose the pronoun.");
warn("<b>leur</b> here has no <b>-s</b>, ever. Don’t confuse it with the possessive <i>leur / leurs</i> (“their”), which does take one: <i>leur<b>s</b> enfants</i> = their children, but <i>je <b>leur</b> parle</i> = I speak to them.");

h2('What to take away');
lead("Four sentences. If you remember only these, you have the lesson.");
ex("<b>1 ·</b> <i>à</i> and <i>de</i> fuse with <b>le</b> and <b>les</b>, never with <b>la</b> or <b>l’</b>. → <b>au, aux, du, des</b>.<br><br><b>2 ·</b> With a place, <b>the verb decides</b>, not the place. Going to / being in → <b>à</b>. Coming from → <b>de</b>.<br><br><b>3 ·</b> Ask <b>qui ?</b> or <b>quoi ?</b> after the verb. No preposition → <b>COD</b> (le, la, les). A hidden <b>à</b> → <b>COI</b> (lui, leur).<br><br><b>4 ·</b> The pronoun goes <b>in front of the verb it belongs to</b> — which in the futur proche means in front of the <u>infinitive</u>, not in front of <i>aller</i>.");
note("<b>Homework for yourself.</b> Write ten sentences about your own day. Five using a verb of movement with the right contraction (<i>je vais au…, je rentre du…</i>), and five replacing a person or thing with a pronoun. Then for each one, say out loud which test you used and why. Doing the test consciously now is what makes it automatic later.");
lead("<b>Where this goes next.</b> The class has done COD and COI. The missing third piece is <b>Y</b> and <b>EN</b> — the pronouns for a <u>thing</u> after <i>à</i> and for anything after <i>de</i>. That is almost certainly the next class, and it uses exactly the <b>à / de</b> split you learnt in Part 2.");
lead("In the book: <b>Chapitre 5</b> covers the contracted articles, <b>Chapitre 20</b> the COD and COI pronouns, <b>Chapitre 21</b> Y and EN, and <b>Chapitre 26</b> the prepositions of place in full. This page is the bridge between them.");

<script>



let rate = 1, frVoice = null;
function pickVoice(){
  const v = speechSynthesis.getVoices();
  frVoice = v.find(x=>/fr[-_]FR/i.test(x.lang)) || v.find(x=>/^fr/i.test(x.lang)) || null;
  const s = document.getElementById('voiceStatus');
  if (frVoice) s.textContent = "\u{1F50A} " + frVoice.name;
  else if (v.length) s.textContent = "⚠ no French voice — see Cours 1 page";
}
speechSynthesis.onvoiceschanged = pickVoice; pickVoice();
function utter(text){
  const u = new SpeechSynthesisUtterance(String(text).replace(/\s+([!?])/g,'$1').replace(/___/g,''));
  u.lang='fr-FR'; if(frVoice) u.voice=frVoice; u.rate=(r||rate); return u;
}
function speak(text, r){ speechSynthesis.cancel(); speechSynthesis.speak(utter(text)); }

function makeRow(fr, ph, en){
  const row=document.createElement('div'); row.className='row';
  const btn=document.createElement('button'); btn.className='play'; btn.textContent='▶';
  const txt=document.createElement('div'); txt.className='txt';
  txt.innerHTML='<div class="fr"></div>'+(ph?'<div class="ph"></div>':'')+(en?'<div class="en"></div>':'');
  txt.querySelector('.fr').textContent=fr;
  if(ph) txt.querySelector('.ph').textContent=ph;
  if(en) txt.querySelector('.en').textContent=en;
  btn.onclick=()=>speak(fr); txt.querySelector('.fr').onclick=()=>speak(fr);
  row.appendChild(btn); row.appendChild(txt);
  return row;
}

const content = document.getElementById('content');
const GLOBAL_VOCAB = [];
/* ===== helpers for this page ===== */
function h2(t){ const e=document.createElement('h2'); e.textContent=t; content.appendChild(e); }
function h3(t){ const e=document.createElement('h3'); e.className='sub2'; e.textContent=t; content.appendChild(e); }
function lead(t){ const e=document.createElement('p'); e.className='lead'; e.innerHTML=t; content.appendChild(e); }
function note(t){ const e=document.createElement('div'); e.className='note'; e.innerHTML=t; content.appendChild(e); }
function ex(t){ const e=document.createElement('div'); e.className='example'; e.innerHTML=t; content.appendChild(e); }
function warn(t){ const e=document.createElement('div'); e.className='warn'; e.innerHTML=t; content.appendChild(e); }
function src(t){ const e=document.createElement('div'); e.className='source'; e.innerHTML=t; content.appendChild(e); }
function rows(list){ list.forEach(([fr,ph,en])=>{ content.appendChild(makeRow(fr,ph,en)); GLOBAL_VOCAB.push({fr:fr,en:en}); }); }
function grid(list){
  const g=document.createElement('div'); g.className='grid';
  list.forEach(([fr,ph])=>{
    const c=document.createElement('div'); c.className='cell';
    c.innerHTML='<div class="fr"></div><div class="ph"></div>';
    c.querySelector('.fr').innerHTML=fr; c.querySelector('.ph').innerHTML=ph;
    const plain=String(fr).replace(/<[^>]*>/g,'').replace(/\s*—.*$/,'').trim();
    c.onclick=()=>speak(plain); g.appendChild(c);
  });
  content.appendChild(g);
}
function table(head, body){
  const t=document.createElement('table'); t.className='conjt';
  let html='<tr>'+head.map(h=>'<th>'+h+'</th>').join('')+'</tr>';
  body.forEach(r=>{ html+='<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>'; });
  t.innerHTML=html; content.appendChild(t);
}
function fill(items){
  items.forEach(it=>{
    const d=document.createElement('div'); d.className='fillrow';
    const s=document.createElement('div'); s.className='sent'; s.innerHTML=it.s;
    const inp=document.createElement('input'); inp.placeholder='...';
    const btn=document.createElement('button'); btn.textContent='Check';
    const fb=document.createElement('div'); fb.className='fb';
    function check(){
      const v=inp.value.trim().toLowerCase().replace(/\s+/g,' ').replace(/[.?!]$/,'');
      const ok=it.a.some(a=>a.toLowerCase()===v);
      if(ok){ fb.className='fb ok'; fb.innerHTML='✓ '+it.a[0]+' — '+it.why; speak(it.a[0]); }
      else { fb.className='fb bad'; fb.innerHTML='✗ Answer: <b>'+it.a[0]+'</b> — '+it.why; }
    }
    btn.onclick=check;
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter') check(); });
    d.appendChild(s);
    const line=document.createElement('div'); line.appendChild(inp); line.appendChild(btn);
    d.appendChild(line);
    if(it.en){ const t=document.createElement('div'); t.className='en'; t.style.marginTop='6px'; t.textContent=it.en; d.appendChild(t); }
    d.appendChild(fb);
    content.appendChild(d);
  });
}
function mcq(items){
  items.forEach(it=>{
    const d=document.createElement('div'); d.className='riddle';
    const p=document.createElement('div'); p.className='prompt'; p.innerHTML=it.q;
    const b=document.createElement('div'); b.className='btns';
    const fb=document.createElement('div'); fb.className='fb';
    it.opts.forEach((o,i)=>{
      const btn=document.createElement('button'); btn.textContent=o;
      btn.onclick=()=>{
        if(i===it.a){ fb.className='fb ok'; fb.innerHTML='✓ '+o+' — '+it.why; speak(o); }
        else { fb.className='fb bad'; fb.innerHTML='✗ The answer is <b>'+it.opts[it.a]+'</b> — '+it.why; }
      };
      b.appendChild(btn);
    });
    d.appendChild(p); d.appendChild(b); d.appendChild(fb);
    content.appendChild(d);
  });
}


/* ===== 1 ===== */
function fillx(list){ fill(list.map(x=>({s:x[0], a:[x[1]], en:x[2]||'', why:x[3]||('Réponse : <b>'+x[1]+'</b>')}))); }
function mcqx(list){ mcq(list.map(x=>({q:x[0], opts:x[1], a:x[2], why:x[3]||''}))); }

function read(paras){
  const d=document.createElement('div'); d.className='reading';
  paras.forEach(t=>{
    const el=document.createElement('p'); el.innerHTML=t; el.style.cursor='pointer';
    const plain=String(t).replace(/<[^>]*>/g,'');
    el.onclick=()=>speak(plain);
    d.appendChild(el);
  });
  content.appendChild(d);
}

function dict(items){
  items.forEach((it,n)=>{
    const d=document.createElement('div'); d.className='fillrow';
    const top=document.createElement('div'); top.className='sent';
    top.innerHTML='<b>'+(n+1)+'.</b> Écoutez, puis écrivez ce que vous entendez. <i>(Listen, then write what you hear.)</i>';
    const bar=document.createElement('div'); bar.style.cssText='display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0';
    const pb=document.createElement('button'); pb.textContent='▶ Écouter'; pb.onclick=()=>speak(it.fr);
    const sb=document.createElement('button'); sb.textContent='▶ Lentement'; sb.onclick=()=>speak(it.fr,0.55);
    const inp=document.createElement('input'); inp.placeholder='Écrivez ici…'; inp.style.flex='1';
    const cb=document.createElement('button'); cb.textContent='Vérifier';
    const fb=document.createElement('div'); fb.className='fb';
    function norm(s){ return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim(); }
    cb.onclick=()=>{
      if(norm(inp.value)===norm(it.fr)){ fb.className='fb ok'; fb.innerHTML='✓ <b>'+it.fr+'</b><br>'+(it.en||'')+(it.why?'<br><i>'+it.why+'</i>':''); }
      else { fb.className='fb bad'; fb.innerHTML='✗ Réponse : <b>'+it.fr+'</b><br>'+(it.en||'')+(it.why?'<br><i>'+it.why+'</i>':''); }
    };
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter') cb.onclick(); });
    bar.appendChild(pb); bar.appendChild(sb); bar.appendChild(inp); bar.appendChild(cb);
    d.appendChild(top); d.appendChild(bar); d.appendChild(fb);
    content.appendChild(d);
  });
}



h2('1. Les contractions : à et de devant un article');
lead("Le cours a commencé par un petit tableau que la prof appelle <b>les contractions</b>. L’idée est simple. En français, <b>à</b> et <b>de</b> ne supportent pas de rester à côté de <b>le</b> ni de <b>les</b>. Dès que les deux se touchent, ils fusionnent en un seul mot. Avec <b>la</b> et avec <b>l’</b>, au contraire, il ne se passe rien : les deux mots restent séparés.");

h3('1.1 Les huit formes à connaître par cœur');
table(['&nbsp;','de + article','à + article'],[
 ['<b>masculin</b> — le','de + le = <b>du</b>','à + le = <b>au</b>'],
 ['<b>féminin</b> — la','de + la = <b>de la</b>','à + la = <b>à la</b>'],
 ['<b>voyelle</b> — l’','de + l’ = <b>de l’</b>','à + l’ = <b>à l’</b>'],
 ['<b>pluriel</b> — les','de + les = <b>des</b>','à + les = <b>aux</b>']
]);
rows([
 ['du','dü','of the / from the (masculine)'],
 ['de la','deu la','of the / from the (feminine)'],
 ["de l’",'deu l','of the / from the (before a vowel)'],
 ['des','day','of the / from the (plural)'],
 ['au','oh','to the / at the (masculine)'],
 ['à la','a la','to the / at the (feminine)'],
 ["à l’",'a l',"to the / at the (before a vowel)"],
 ['aux','oh','to the / at the (plural)']
]);
note("<b>Aux</b> et <b>au</b> se prononcent exactement pareil, « oh ». C’est seulement l’orthographe qui change. De même, <b>des</b> se prononce « day » comme <b>les</b> — mais avec un d. Quand vous écoutez, c’est le mot qui suit qui vous dit si c’est singulier ou pluriel : <i>au cinéma</i> (un cinéma) contre <i>aux toilettes</i> (plusieurs).");
warn("Deux formes seulement sont de vraies fusions : <b>du</b> et <b>des</b>, <b>au</b> et <b>aux</b>. Les quatre autres — <i>de la, de l’, à la, à l’</i> — s’écrivent en deux mots. Beaucoup d’élèves écrivent « dela » ou « ala » : c’est faux.");
ex("Sans contraction, on dirait : <i>Je vais <s>à le</s> cinéma</i>. Impossible. On écrit <b>Je vais au cinéma</b>. Mais <i>Je vais <b>à la</b> plage</i> est parfaitement correct, parce que <b>la</b> ne fusionne jamais.");

h3('1.2 Pourquoi la liaison compte ici');
lead("Avec <b>aux</b> et <b>des</b> devant une voyelle, le <b>s</b> final se réveille et se prononce <b>z</b>. C’est la liaison.");
rows([
 ['aux enfants','oh-zan-fan','to the children'],
 ['des amis','day-za-mi','of the friends / some friends'],
 ['aux États-Unis','oh-zay-ta-zü-ni','to the United States'],
 ['des hôtels','day-zo-tel','of the hotels']
]);
note("Devant une consonne, pas de liaison : <i>aux toilettes</i> se dit « oh twa-let », sans z.");

h2('2. Les articles avec les lieux : c’est le verbe qui décide');
lead("La deuxième partie du cours s’appelait « <i>Articles used with places &amp; other forms</i> ». C’est le point le plus utile de la journée, et le tableau de la classe le montre sans le dire : <b>ce n’est pas le lieu qui choisit la préposition, c’est le verbe</b>. Demandez-vous dans quelle direction va l’action.");

h3('2.1 La règle en une image');
table(['Direction','Verbes typiques','Masc','Fém','Pluriel','Voyelle'],[
 ['<b>vers le lieu / dans le lieu</b><br><span class="en">to, at, in</span>','aller, habiter, travailler, être, vivre','<b>au</b>','<b>à la</b>','<b>aux</b>','<b>à l’</b>'],

ex("<b>Je vais au bureau</b> — j’y vais, direction le lieu, donc <b>à</b>.<br><b>Je viens du bureau</b> — j’en sors, direction inverse, donc <b>de</b>.<br>Même lieu, même phrase, deux prépositions opposées, uniquement à cause du verbe.");

h3('2.2 Un troisième emploi de « de » : la possession');
lead("Le tableau de la classe mélange deux choses sous le mot « <i>of</i> ». À côté de l’idée de provenance, <b>de</b> sert aussi à relier deux noms : le second possède ou qualifie le premier. L’anglais met ’s ou of ; le français met toujours <b>de</b>.");

h2('3. Les pronoms COD');
lead("La deuxième moitié du cours passe à un tout autre sujet : les <b>pronoms compléments d’objet direct</b>, les COD. L’idée est celle de n’importe quelle langue — on ne répète pas un nom qu’on vient de dire. En anglais vous dites <i>I know Marie → I know <b>her</b></i>. Le français fait pareil, mais il place le pronom <b>avant</b> le verbe, pas après. C’est toute la difficulté.");

h3('3.1 La liste de la classe');
table(['Sujet','COD','Anglais'],[
 ['je','<b>me</b> (m’)','me'],
 ['tu','<b>te</b> (t’)','you'],
 ['il / elle','<b>le / la</b> (l’)','him / her / it'],
 ['nous','<b>nous</b>','us'],
 ['vous','<b>vous</b>','you'],
 ['ils / elles','<b>les</b>','them'],
 ['—','<b>se</b> (s’)','each other / oneself']
]);
rows([
 ['Il m’aime.','eel mem','He loves me.'],
 ['Elle va t’inviter.','el va tan-vi-tay','She’s going to invite you.'],
 ['Fabio nous cherche.','Fa-byo noo shairsh','Fabio is looking for us.'],
 ['On se voit quand ?','on seu vwa kan','When are we seeing each other?'],
 ['Je vous présente mon ami.','zheu voo pray-zant mon-na-mi','Let me introduce my friend to you.'],
 ['Il vous déteste.','eel voo day-test','He hates you.'],
 ['Elle ne me connaît pas.','el neu meu ko-nay pa','She doesn’t know me.']
]);
note("<b>Me, te, se, le, la</b> perdent leur voyelle devant une voyelle ou un h muet : <i>il <b>m’</b>aime</i>, <i>je <b>t’</b>invite</i>, <i>on <b>s’</b>appelle</i>, <i>je <b>l’</b>adore</i>. <b>Nous, vous, les</b> ne changent jamais — mais <b>les</b> fait la liaison : <i>je les aime</i> se dit « zheu lay-zem ».");

h3('3.2 Comment reconnaître un COD');
lead("La prof donne le test, et c’est le bon : posez <b>qui ?</b> ou <b>quoi ?</b> <u>après</u> le verbe. Si la réponse vient sans préposition, c’est un COD.");
ex("<i>Je cherche <b>mon frère</b>.</i> → Je cherche <b>qui</b> ? mon frère. Pas de préposition → COD → <b>Je le cherche.</b><br><i>Je parle <b>à mon frère</b>.</i> → Je parle <b>à qui</b> ? Il y a un <b>à</b> → ce n’est pas un COD, c’est un COI → <b>Je lui parle.</b>");
warn("Le piège est que l’anglais ne met pas toujours la préposition là où le français la met. <i>To phone someone</i> est direct en anglais, mais <b>téléphoner <u>à</u> quelqu’un</b> en français. Il faut vérifier en français, pas en anglais.");

h3('3.3 Les verbes du cours qui prennent un COD');
lead("Le tableau de droite liste des verbes suivis directement de <b>quelqu’un</b>, sans préposition. Ce sont donc des verbes à COD.");
rows([
 ['aimer quelqu’un','ay-may kel-kan','to love somebody'],
 ['adorer quelqu’un','a-do-ray kel-kan','to adore somebody'],
 ['chercher quelqu’un','shair-shay kel-kan','to look for somebody'],
 ['inviter quelqu’un','an-vi-tay kel-kan','to invite somebody'],
 ['connaître quelqu’un','ko-nay-treu kel-kan','to know somebody'],
 ['voir quelqu’un','vwar kel-kan','to see somebody'],
 ['détester quelqu’un','day-tes-tay kel-kan','to hate somebody'],
 ['présenter quelqu’un','pray-zan-tay kel-kan','to introduce somebody']
]);
note("Notez que <i>chercher</i> et <i>regarder</i> sont directs en français alors que l’anglais ajoute une particule : <i>to look <b>for</b></i>, <i>to look <b>at</b></i>. Ne traduisez pas la particule — <b>je le cherche</b>, pas « je cherche pour lui ».");
warn("Dans le document de la classe le verbe est écrit « Connaitre » et « Connaissez ». L’orthographe traditionnelle, celle du TCF et des dictionnaires, est <b>connaître</b> avec l’accent circonflexe sur le i devant un t. Écrivez-la avec l’accent.");

h3('3.4 La place du pronom');
lead("Voici le vrai sujet du cours. Le pronom COD se colle <b>devant le verbe qui le gouverne</b>. Trois cas suffisent pour tout couvrir.");
table(['Temps','Affirmatif','Négatif'],[
 ['<b>présent</b>','sujet + <b>pronom</b> + verbe<br><i>Il <b>te</b> cherche.</i>','sujet + <b>ne</b> + pronom + verbe + <b>pas</b><br><i>Elle ne <b>vous</b> connaît pas.</i>'],
 ['<b>futur proche</b>','sujet + aller + <b>pronom</b> + infinitif<br><i>Je vais <b>le</b> voir.</i>','sujet + ne + aller + pas + <b>pronom</b> + infinitif<br><i>Je ne vais pas <b>le</b> voir.</i>'],
 ['<b>passé composé</b>','sujet + <b>pronom</b> + auxiliaire + participe<br><i>Je <b>l’</b>ai vu.</i>','sujet + ne + <b>pronom</b> + auxiliaire + pas + participe<br><i>Je ne <b>l’</b>ai pas vu.</i>']
]);
ex("Au <b>présent</b> et au <b>passé composé</b>, le pronom passe devant tout le bloc verbal, <b>ne</b> compris : <i>je ne <b>le</b> connais pas</i>, <i>je ne <b>l’</b>ai pas invité</i>.<br>Au <b>futur proche</b>, c’est différent : <i>aller</i> est conjugué mais ce n’est pas lui qui mange l’objet — c’est l’infinitif. Le pronom va donc <b>entre les deux verbes</b> : <i>je ne vais pas <b>le</b> voir</i>.");

h3('3.5 Le participe passé s’accorde avec le COD placé avant');
lead("Un point que la classe n’a pas encore abordé mais qui tombe au TCF : au passé composé avec <b>avoir</b>, si le COD est <u>devant</u> le verbe, le participe s’accorde avec lui.");
ex("<i>J’ai vu <b>Marie</b>.</i> → le COD est après, pas d’accord.<br><i>Je <b>l’</b>ai vu<b>e</b>.</i> → le COD <i>l’</i> = Marie, féminin, placé avant → on ajoute <b>-e</b>.<br><i>Je <b>les</b> ai invité<b>s</b>.</i> → pluriel masculin → <b>-s</b>.");
note("À l’oral, l’accord ne s’entend presque jamais — <i>vu / vue / vus</i> se disent pareil. Il s’entend seulement avec les participes en consonne : <i>je l’ai mi<b>se</b></i>, <i>je l’ai fai<b>te</b></i>. À l’écrit, il se voit toujours.");

h2('4. Ce qu’il faut retenir');
lead("Deux règles, et elles tiennent en deux questions.");
ex("<b>Pour la préposition :</b> dans quel sens va l’action ? Vers le lieu → <b>au / à la / aux / à l’</b>. Depuis le lieu → <b>du / de la / des / de l’</b>.<br><br><b>Pour le pronom :</b> le verbe prend-il une préposition ? Non → COD (<i>le, la, les</i>). Oui, avec <b>à</b> → COI (<i>lui, leur</i>). Et le pronom se place devant le verbe qui le gouverne.");
note("<b>Pour la prochaine fois</b> — écrivez dix phrases sur votre journée : cinq avec un verbe de mouvement et la bonne contraction, cinq avec un pronom COD. Puis relisez-les en vous demandant, pour chacune, « qui ? quoi ? » après le verbe.");
lead("Le <b>chapitre 5</b> du livre traite les articles contractés, le <b>chapitre 20</b> les pronoms COD et COI, le <b>chapitre 21</b> les pronoms <i>y</i> et <i>en</i>, et le <b>chapitre 26</b> les prépositions de lieu en entier. Cette page relie les quatre.");

<script>



let rate = 1, frVoice = null;
function pickVoice(){
  const v = speechSynthesis.getVoices();
  frVoice = v.find(x=>/fr[-_]FR/i.test(x.lang)) || v.find(x=>/^fr/i.test(x.lang)) || null;
  const s = document.getElementById('voiceStatus');
  if (frVoice) s.textContent = "\u{1F50A} " + frVoice.name;
  else if (v.length) s.textContent = "⚠ no French voice — see Cours 1 page";
}
speechSynthesis.onvoiceschanged = pickVoice; pickVoice();
function utter(text){
  const u = new SpeechSynthesisUtterance(String(text).replace(/\s+([!?])/g,'$1').replace(/___/g,''));
  u.lang='fr-FR'; if(frVoice) u.voice=frVoice; u.rate=(r||rate); return u;
}
function speak(text, r){ speechSynthesis.cancel(); speechSynthesis.speak(utter(text)); }

function makeRow(fr, ph, en){
  const row=document.createElement('div'); row.className='row';
  const btn=document.createElement('button'); btn.className='play'; btn.textContent='▶';
  const txt=document.createElement('div'); txt.className='txt';
  txt.innerHTML='<div class="fr"></div>'+(ph?'<div class="ph"></div>':'')+(en?'<div class="en"></div>':'');
  txt.querySelector('.fr').textContent=fr;
  if(ph) txt.querySelector('.ph').textContent=ph;
  if(en) txt.querySelector('.en').textContent=en;
  btn.onclick=()=>speak(fr); txt.querySelector('.fr').onclick=()=>speak(fr);
  row.appendChild(btn); row.appendChild(txt);
  return row;
}

const content = document.getElementById('content');
const GLOBAL_VOCAB = [];
/* ===== helpers for this page ===== */
function h2(t){ const e=document.createElement('h2'); e.textContent=t; content.appendChild(e); }
function h3(t){ const e=document.createElement('h3'); e.className='sub2'; e.textContent=t; content.appendChild(e); }
function lead(t){ const e=document.createElement('p'); e.className='lead'; e.innerHTML=t; content.appendChild(e); }
function note(t){ const e=document.createElement('div'); e.className='note'; e.innerHTML=t; content.appendChild(e); }
function ex(t){ const e=document.createElement('div'); e.className='example'; e.innerHTML=t; content.appendChild(e); }
function warn(t){ const e=document.createElement('div'); e.className='warn'; e.innerHTML=t; content.appendChild(e); }
function src(t){ const e=document.createElement('div'); e.className='source'; e.innerHTML=t; content.appendChild(e); }
function rows(list){ list.forEach(([fr,ph,en])=>{ content.appendChild(makeRow(fr,ph,en)); GLOBAL_VOCAB.push({fr:fr,en:en}); }); }
function grid(list){
  const g=document.createElement('div'); g.className='grid';
  list.forEach(([fr,ph])=>{
    const c=document.createElement('div'); c.className='cell';
    c.innerHTML='<div class="fr"></div><div class="ph"></div>';
    c.querySelector('.fr').innerHTML=fr; c.querySelector('.ph').innerHTML=ph;
    const plain=String(fr).replace(/<[^>]*>/g,'').replace(/\s*—.*$/,'').trim();
    c.onclick=()=>speak(plain); g.appendChild(c);
  });
  content.appendChild(g);
}
function table(head, body){
  const t=document.createElement('table'); t.className='conjt';
  let html='<tr>'+head.map(h=>'<th>'+h+'</th>').join('')+'</tr>';
  body.forEach(r=>{ html+='<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>'; });
  t.innerHTML=html; content.appendChild(t);
}
function fill(items){
  items.forEach(it=>{
    const d=document.createElement('div'); d.className='fillrow';
    const s=document.createElement('div'); s.className='sent'; s.innerHTML=it.s;
    const inp=document.createElement('input'); inp.placeholder='...';
    const btn=document.createElement('button'); btn.textContent='Check';
    const fb=document.createElement('div'); fb.className='fb';
    function check(){
      const v=inp.value.trim().toLowerCase().replace(/\s+/g,' ').replace(/[.?!]$/,'');
      const ok=it.a.some(a=>a.toLowerCase()===v);
      if(ok){ fb.className='fb ok'; fb.innerHTML='✓ '+it.a[0]+' — '+it.why; speak(it.a[0]); }
      else { fb.className='fb bad'; fb.innerHTML='✗ Answer: <b>'+it.a[0]+'</b> — '+it.why; }
    }
    btn.onclick=check;
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter') check(); });
    d.appendChild(s);
    const line=document.createElement('div'); line.appendChild(inp); line.appendChild(btn);
    d.appendChild(line);
    if(it.en){ const t=document.createElement('div'); t.className='en'; t.style.marginTop='6px'; t.textContent=it.en; d.appendChild(t); }
    d.appendChild(fb);
    content.appendChild(d);
  });
}
function mcq(items){
  items.forEach(it=>{
    const d=document.createElement('div'); d.className='riddle';
    const p=document.createElement('div'); p.className='prompt'; p.innerHTML=it.q;
    const b=document.createElement('div'); b.className='btns';
    const fb=document.createElement('div'); fb.className='fb';
    it.opts.forEach((o,i)=>{
      const btn=document.createElement('button'); btn.textContent=o;
      btn.onclick=()=>{
        if(i===it.a){ fb.className='fb ok'; fb.innerHTML='✓ '+o+' — '+it.why; speak(o); }
        else { fb.className='fb bad'; fb.innerHTML='✗ The answer is <b>'+it.opts[it.a]+'</b> — '+it.why; }
      };
      b.appendChild(btn);
    });
    d.appendChild(p); d.appendChild(b); d.appendChild(fb);
    content.appendChild(d);
  });
}


/* ===== 1 ===== */
function fillx(list){ fill(list.map(x=>({s:x[0], a:[x[1]], en:x[2]||'', why:x[3]||('Réponse : <b>'+x[1]+'</b>')}))); }
function mcqx(list){ mcq(list.map(x=>({q:x[0], opts:x[1], a:x[2], why:x[3]||''}))); }

function read(paras){
  const d=document.createElement('div'); d.className='reading';
  paras.forEach(t=>{
    const el=document.createElement('p'); el.innerHTML=t; el.style.cursor='pointer';
    const plain=String(t).replace(/<[^>]*>/g,'');
    el.onclick=()=>speak(plain);
    d.appendChild(el);
  });
  content.appendChild(d);
}

function dict(items){
  items.forEach((it,n)=>{
    const d=document.createElement('div'); d.className='fillrow';
    const top=document.createElement('div'); top.className='sent';
    top.innerHTML='<b>'+(n+1)+'.</b> Écoutez, puis écrivez ce que vous entendez. <i>(Listen, then write what you hear.)</i>';
    const bar=document.createElement('div'); bar.style.cssText='display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0';
    const pb=document.createElement('button'); pb.textContent='▶ Écouter'; pb.onclick=()=>speak(it.fr);
    const sb=document.createElement('button'); sb.textContent='▶ Lentement'; sb.onclick=()=>speak(it.fr,0.55);
    const inp=document.createElement('input'); inp.placeholder='Écrivez ici…'; inp.style.flex='1';
    const cb=document.createElement('button'); cb.textContent='Vérifier';
    const fb=document.createElement('div'); fb.className='fb';
    function norm(s){ return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim(); }
    cb.onclick=()=>{
      if(norm(inp.value)===norm(it.fr)){ fb.className='fb ok'; fb.innerHTML='✓ <b>'+it.fr+'</b><br>'+(it.en||'')+(it.why?'<br><i>'+it.why+'</i>':''); }
      else { fb.className='fb bad'; fb.innerHTML='✗ Réponse : <b>'+it.fr+'</b><br>'+(it.en||'')+(it.why?'<br><i>'+it.why+'</i>':''); }
    };
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter') cb.onclick(); });
    bar.appendChild(pb); bar.appendChild(sb); bar.appendChild(inp); bar.appendChild(cb);
    d.appendChild(top); d.appendChild(bar); d.appendChild(fb);
    content.appendChild(d);
  });
}

h2('0 · À lire avant le reste — les corrections de prononciation');
warn("<b>Les fiches de prononciation que vous avez reçues contiennent une quinzaine d’erreurs.</b> Ce n’est pas grave et ce n’est pas votre faute — mais si vous les répétez à voix haute, elles vont s’installer, et une prononciation mal apprise coûte trois fois plus cher à corriger qu’à apprendre.<br><br><b>Voici les corrections.</b> Les plus importantes sont en haut.");
table(['Mot ou phrase','Ce qui était écrit','La bonne prononciation','Pourquoi'],[
 ['<b>partager</b>','<i>shar-tay</i>','<b>par-tah-ZHAY</b>','mot complètement différent — erreur de frappe'],
 ['<b>j’ai acheté</b>','<i>zhay aш-tuh</i>','<b>zhay ahsh-TAY</b>','il y avait un caractère cyrillique dans le texte'],
 ['<b>préparer</b>','<i>pray-par-uh</i>','<b>pray-pah-RAY</b>','-er final = AY, jamais « uh »'],
 ['<b>montrer</b>','<i>mohntr</i>','<b>mohn-TRAY</b>','même règle : -er = AY'],
 ['<b>le but</b>','<i>luh beet</i>','<b>luh BEWT</b>','le <b>u</b> français, pas « ee »'],
 ['<b>un miroir</b>','<i>un meer-war</i>','<b>uhn mee-RWAHR</b>','<i>-oir</i> = WAHR'],
 ['<b>une horloge</b>','<i>or-log</i>','<b>or-LOZH</b>','le <b>g</b> devant <b>e</b> est doux (ZH), pas dur'],
 ['<b>C’est un cadeau</b>','<i>say un kah-doh</i>','<b>say-TUHN kah-DOH</b>','liaison obligatoire : <i>c’es<b>t</b> un</i>'],
 ['<b>Elle est en argent</b>','<i>el eh tahn ahr-zhahn</i>','<b>e-lay tah-nar-ZHAHN</b>','deux liaisons enchaînées'],
 ['<b>Sur mon bureau</b>','<i>Sur mohn…</i>','<b>SEWR mohn…</b>','<i>sur</i> a le son <b>u</b>, pas « sour »'],
 ['<b>il a un écran</b>','<i>un ay-krahn</i>','<b>uh-nay-KRAHN</b>','liaison : <i>u<b>n</b> écran</i>'],
 ['<b>indispensable</b>','<i>lan-dees-pahn-stabl</i>','<b>an-dees-pahn-SAHBL</b>','syllabe finale mal découpée'],
 ['<b>marché aux puces</b>','<i>oh pues</i>','<b>oh PEWSS</b>','le <b>s</b> final se prononce ici'],
 ['<b>Choisissez</b>','<i>Schwa-zi-say</i>','<b>shwah-zee-SAY</b>','« schwa » prête à confusion'],
 ['<b>la peinture</b>','<i>peyn-chur</i>','<b>pan-TEWR</b>','<i>ein</i> = nasale AN, et <i>-ure</i> = EWR'],
 ['<b>N’utilisez pas</b>','<i>Nay-too-li-zay</i>','<b>new-tee-lee-ZAY</b>','<i>n’u-</i> = NEW, pas « nay »'],
 ['<b>Mesurez</b>','<i>Muh-zu-ray</i>','<b>muh-zew-RAY</b>','le <b>u</b> français'],
 ['<b>des agrafes</b>','<i>d’ag-raf</i>','<b>day-zah-GRAF</b>','liaison au pluriel']
]);
note("<b>Et une petite mise au point honnête sur ma propre notation.</b><br><br>Tout ce que j’écris moi aussi (<i>mohn-TRAY</i>, <i>or-LOZH</i>) reste une <b>approximation</b> en lettres anglaises. Aucun système de ce type ne rend exactement le français — le <b>u</b>, le <b>r</b> et les nasales n’existent pas en anglais.<br><br><b>Donc la règle :</b> servez-vous de l’écriture pour vous orienter, mais <b>vérifiez toujours au son</b>. Cliquez les lignes de ce site pour entendre, ou tapez le mot dans <b>Forvo</b> pour entendre de vrais francophones. Le son est la référence, jamais la transcription.");
warn("<b>Une erreur dans le texte source lui-même — pas dans vos notes.</b><br><br>Le texte « Les vêtements » de lingua.com dit :<br><br>· <i>« Lili et Marc vont <b>à plage</b> pendant le weekend. »</i><br><br>C’est incorrect. Il faut : <b>à la plage</b>. L’article est obligatoire.<br><br>Ce n’est pas grave, mais c’est un bon rappel : <b>les sites gratuits contiennent des coquilles</b>. Quand quelque chose vous paraît bizarre, méfiez-vous plutôt du site que de vous-même — surtout quand ça contredit une règle que vous connaissez.");

h2('1 · Piste 65 — l’audio de la famille Castel, enfin complet');
lead('Je n’avais pas pu l’entendre pendant le cours. Avec la transcription, on peut enfin remplir le tableau.');
warn("<b>D’abord : combien de personnes parlent ?</b><br><br>Le livre demande « Que font <u>les trois personnes</u> ? ». Dans la transcription, on entend :<br><br>· <b>le fils</b> — il pose les questions et propose de vendre<br>· <b>le père</b> — il raconte le vélo et le tourne-disque<br>· <b>le grand-père</b> — identifié par la réplique du fils : <i>« C’est à toi, <b>papi</b> ? »</i>, et c’est lui qui parle de la radio et des années 50<br><br><b>Donc trois générations :</b> le fils, le père, le grand-père. Les notes que vous avez reçues disaient « deux personnes » — c’est ce qui arrive quand on compte les voix sans relier <i>papi</i> à un troisième locuteur.<br><br><i>Je n’ai pas entendu l’audio moi-même — je travaille sur la transcription. Si en classe la prof a attribué les répliques autrement, dites-le-moi.</i>");

warn("<b>CE DOCUMENT ENSEIGNE L’IMPÉRATIF — et c’est pour ça qu’il a été choisi.</b><br><br>Regardez les verbes : <b>Nettoyez</b>, <b>Mesurez</b>, <b>Choisissez</b>, <b>découpez</b>, <b>Collez</b>, <b>Ne mettez pas</b>, <b>N’utilisez pas</b>.<br><br>Aucun sujet devant. C’est <b>l’impératif</b> : le mode des ordres, des conseils et des instructions. Un tutoriel de bricolage en est entièrement fait — c’est le texte idéal pour l’introduire.<br><br>Et c’est <b>très utile pour le TCF</b> : les recettes, les modes d’emploi, les consignes et les panneaux sont du matériel classique de compréhension écrite, et l’impératif y est partout.");

h2('3 · L’impératif — la grammaire du jour');
lead('Trois formes, aucun sujet, et une seule irrégularité qui compte.');
warn("<b>L’impératif, c’est le présent SANS le pronom sujet.</b><br><br>· <i>tu <b>nettoies</b></i> → <b>Nettoie !</b><br>· <i>vous <b>nettoyez</b></i> → <b>Nettoyez !</b><br>· <i>nous <b>nettoyons</b></i> → <b>Nettoyons !</b><br><br><b>Il n’existe que trois personnes</b> — <i>tu</i>, <i>nous</i>, <i>vous</i>. On ne donne pas d’ordre à <i>je</i>, <i>il</i> ou <i>ils</i>, donc ces formes n’existent pas. C’est le temps le plus court du français.");
table(['','tu → ordre familier','vous → ordre poli ou pluriel','nous → « allons-y »'],[
 ['<b>regarder</b>','Regarde !','Regardez !','Regardons !'],
 ['<b>finir</b>','Finis !','Finissez !','Finissons !'],
 ['<b>attendre</b>','Attends !','Attendez !','Attendons !'],
 ['<b>faire</b>','Fais !','Faites !','Faisons !'],
 ['<b>prendre</b>','Prends !','Prenez !','Prenons !'],
 ['<b>venir</b>','Viens !','Venez !','Venons !']
]);
warn("<b>LA SEULE RÈGLE QUI SURPREND : les verbes en -ER perdent leur S à la forme TU.</b><br><br>· présent : <i>tu regarde<b>s</b></i> → impératif : <b>Regarde !</b> <span style=\"color:#0f7a54\">(sans s)</span><br>· présent : <i>tu écoute<b>s</b></i> → <b>Écoute !</b><br>· présent : <i>tu va<b>s</b></i> → <b>Va !</b><br><br><b>Mais les autres groupes gardent leur s :</b><br>· <i>tu fini<b>s</b></i> → <b>Finis !</b> ✔<br>· <i>tu attend<b>s</b></i> → <b>Attends !</b> ✔<br><br>Pourquoi : c’est purement de l’orthographe. Le <b>s</b> était de toute façon muet, et l’Académie l’a supprimé là où il ne servait à rien.<br><br><b>Une exception à l’exception :</b> le <b>s</b> revient devant <b>y</b> et <b>en</b>, pour la liaison. <i><b>Vas-y !</b></i> (vah-ZEE), <i><b>Manges-en !</b></i> (mahnzh-AHN).");
h3('Les quatre verbes vraiment irréguliers');
table(['Infinitif','tu','vous','nous','Usage'],[

 ['<b>avoir</b>','Aie','Ayez','Ayons','<i>N’ayez pas peur !</i>'],

note("<b>VEUILLEZ est le mot le plus poli du français administratif</b>, et vous le verrez partout dans les documents officiels :<br><br>· <i><b>Veuillez</b> patienter.</i> — Please wait.<br>· <i><b>Veuillez</b> remplir ce formulaire.</i> — Please fill in this form.<br>· <i><b>Veuillez</b> agréer…</i> — la formule de fin de lettre formelle.<br><br>Dans une lettre formelle au TCF (tâche 2 de l’expression écrite), un <b>Veuillez</b> bien placé vaut des points de registre.");
h3('L’impératif négatif');
ex("<b>Exactement la règle du Chapitre 12 : <i>ne</i> devant, <i>pas</i> derrière.</b><br><br>· <b>Ne</b> mettez <b>pas</b> de colle !<br>· <b>N’</b>utilisez <b>pas</b> de scotch de mauvaise qualité !<br>· <b>Ne</b> t’inquiète <b>pas</b> ! — Don’t worry!<br>· <b>N’</b>oubliez <b>pas</b> votre pièce d’identité !<br><br><b>Et la règle de l’article tient toujours :</b> <i>Ne mettez pas <b>de</b> colle</i> — <i>de la colle</i> devient <b>de</b> après la négation. La Fiche 43 l’applique deux fois.");
warn("<b>Le seul piège réel de l’impératif : la place des pronoms change selon l’affirmatif ou le négatif.</b><br><br><b>À l’affirmatif, le pronom passe APRÈS, avec un trait d’union :</b><br>· <i>Découpez-<b>les</b> !</i> — Cut them out! <span style=\"color:#6b675f\">(la Fiche 43)</span><br>· <i>Regarde-<b>moi</b> !</i> — et <b>me</b> devient <b>moi</b><br>· <i>Donnez-<b>lui</b> !</i><br><br><b>Au négatif, il revient AVANT, comme d’habitude :</b><br>· <i><b>Ne les</b> découpez <b>pas</b> !</i><br>· <i><b>Ne me</b> regarde <b>pas</b> !</i> — et <b>moi</b> redevient <b>me</b><br><br>C’est le seul endroit du français où un pronom se déplace comme ça. Les pronoms complèts arrivent au Chapitre 19 — pour l’instant, retenez juste la paire <b>Découpez-les</b> / <b>Ne les découpez pas</b>.");

h2('4 · Décrire un objet qui compte pour vous — la production');
lead('L’exercice que vous avez travaillé : cinq lignes sur un objet qui a une valeur sentimentale.');
warn("<b>Pourquoi cet exercice revient sans arrêt — et pourquoi il faut le prendre au sérieux.</b><br><br>« Décrivez un objet qui compte pour vous » est un sujet classique de l’<b>expression orale tâche 1</b> et de l’<b>expression écrite tâche 1</b>. Il combine tout ce que l’Unité 7 enseigne :<br><br>· la <b>description</b> (forme, matière, taille) — p. 137–138<br>· l’<b>état</b> de l’objet — l’encadré Mots et expressions<br>· l’<b>imparfait</b> pour le souvenir — le tableau de la piste 65<br>· le <b>passé composé</b> pour dire comment vous l’avez eu<br><br><b>Préparez-en un et apprenez-le.</b> Vous le réutiliserez.");
h3('La structure en cinq temps');
ex("<b>① Ce que c’est et où il est</b> — <i>Sur mon bureau, j’ai…</i><br><b>② Description physique</b> — taille, forme, matière, couleur<br><b>③ D’où il vient</b> — <u>passé composé</u> : <i>C’est un cadeau de… / Je l’ai trouvé…</i><br><b>④ Ce que vous en faites</b> — <u>présent</u> : <i>Je ne le porte pas tous les jours, mais…</i><br><b>⑤ Pourquoi il compte</b> — <u>imparfait</u> pour le souvenir : <i>Quand j’étais petit…</i><br><br><b>Trois temps en cinq phrases.</b> C’est exactement ce qui fait passer de A2 à B1 à l’oral — pas le vocabulaire, la <u>gamme de temps</u>.");

h3('La version longue — 8 phrases, pour l’oral');
ex("<i>Sur mon bureau, j’ai une vieille montre de famille. C’est un cadeau de mon grand-père.<br><br>Elle est petite et ronde, en argent, et elle fait environ quatre centimètres de diamètre. Elle est un peu abîmée — le bracelet est usé — mais elle marche encore très bien.<br><br>Mon grand-père me l’a donnée avant mon départ pour le Canada. Quand j’étais petit, il la portait tous les jours et il me montrait l’heure avec.<br><br>Je ne la porte pas souvent, parce que j’ai peur de la perdre. Mais je la garde précieusement sur mon bureau, et chaque matin je la regarde.<br><br>Cet objet me rappelle de beaux souvenirs d’enfance, et surtout il me rappelle mon grand-père.</i><br><br><b>Comptez :</b> présent, passé composé, imparfait, une dimension, un état, une négation avec <i>de</i>, deux connecteurs, et une chute émotionnelle. C’est du B1 solide, et ça tient en 50 secondes.");

<script>
let rate = 0.85, frVoice = null;
function pickVoice(){
  const v = speechSynthesis.getVoices();
  frVoice = v.find(x=>/fr[-_]FR/i.test(x.lang)) || v.find(x=>/^fr/i.test(x.lang)) || null;
  const s = document.getElementById('voiceStatus');
  if (frVoice) s.textContent = "\u{1F50A} " + frVoice.name;
  else if (v.length) s.textContent = "⚠ no French voice — see Cours 1 page";
}
speechSynthesis.onvoiceschanged = pickVoice; pickVoice();
function clean(t){ return String(t).replace(/\s+([!?])/g,'$1').replace(/…/g,'...'); }
function speak(text){
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(clean(text));
  u.lang='fr-FR'; if(frVoice) u.voice=frVoice; u.rate=rate;
  speechSynthesis.speak(u);
}
function makeRow(fr, ph, en){
  const row=document.createElement('div'); row.className='row';
  const btn=document.createElement('button'); btn.className='play'; btn.textContent='▶';
  const txt=document.createElement('div'); txt.className='txt';
  txt.innerHTML='<div class="fr"></div>'+(ph?'<div class="ph"></div>':'')+(en?'<div class="en"></div>':'');
  txt.querySelector('.fr').textContent=fr;
  if(ph) txt.querySelector('.ph').textContent=ph;
  if(en) txt.querySelector('.en').textContent=en;
  btn.onclick=()=>speak(fr); txt.querySelector('.fr').onclick=()=>speak(fr);
  row.appendChild(btn); row.appendChild(txt);
  return row;
}

{
 id:'d6', tab:'6. Mon appartement', level:'A1+ · élémentaire',
 title:"Mon appartement — housing and prepositions of place",
 intro:"A friend visits a new flat. Almost every line contains a preposition of place — and several of them contract.",
 lines:[
  {who:'Yanis', fr:"Alors, c'est ton nouvel appartement ? Il est joli !", ph:"ah-LOR, seh tohn noo-vell ah-par-tuh-MAHN. eel eh zhoh-LEE", en:"So this is your new flat? It's nice!"},
  {who:'Nour', fr:"Merci ! Il fait quarante mètres carrés, au troisième étage.", ph:"mehr-SEE. eel feh kah-rahnt meh-truh kah-RAY, oh trwah-zyem ay-TAZH", en:"Thanks! It's forty square metres, on the third floor."},
  {who:'Yanis', fr:"Il y a un ascenseur ?", ph:"eel yah uhn ah-sahn-SUR", en:"Is there a lift?"},
  {who:'Nour', fr:"Oui, heureusement ! La cuisine est à côté du salon.", ph:"wee, uh-ruhz-MAHN. lah kwee-ZEEN eh ah koh-tay dew sah-LOHN", en:"Yes, luckily! The kitchen is next to the living room."},
  {who:'Yanis', fr:"Et la chambre ?", ph:"ay lah SHAHM-bruh", en:"And the bedroom?"},
  {who:'Nour', fr:"Derrière cette porte. La salle de bains est en face.", ph:"deh-RYEHR set PORT. lah sal duh ban eh tahn FASS", en:"Behind that door. The bathroom is opposite."},
  {who:'Yanis', fr:"C'est loin du centre-ville ?", ph:"seh lwan dew sahntr-VEEL", en:"Is it far from the town centre?"},
  {who:'Nour', fr:"Non, c'est tout près. Il y a un parc juste devant l'immeuble.", ph:"nohn, seh too PREH. eel yah uhn park zhewst duh-vahn lee-MUH-bluh", en:"No, it's very close. There's a park right in front of the building."},
  {who:'Yanis', fr:"Tu as de la chance !", ph:"tew ah duh lah SHAHNSS", en:"You're lucky!"}
 ],
 gloss:[
  ["ton nouvel appartement","tohn noo-vell ah-par-tuh-MAHN","your new flat"],
  ["quarante mètres carrés","kah-rahnt meh-truh kah-RAY","forty square metres"],

  ["loin du centre-ville","lwan dew sahntr-VEEL","far from the town centre"],

  ["juste devant l'immeuble","zhewst duh-vahn lee-MUH-bluh","right in front of the building"],
  ["Tu as de la chance !","tew ah duh lah SHAHNSS","You're lucky!"]
 ],
 questions:[
  {q:"Which floor is the flat on?", opts:["The second","The third","The fourth"], a:1, why:"« au troisième étage » — the third floor, and there's a lift."},
  {q:"Where is the park?", opts:["Behind the building","In front of the building","Next to the kitchen"], a:1, why:"« un parc juste devant l'immeuble » — right in front of it."},
  {q:"Why « du salon » but « de la chance »?", opts:["de + le = du (salon is masculine); de la doesn't contract","It's a typo","Chance is plural"], a:0, why:"de + le contracts to du. de + la never changes."},
  {q:"Why « nouvel appartement » and not « nouveau »?", opts:["Before a masculine noun starting with a vowel","Because it's plural","It's a mistake"], a:0, why:"beau/bel, nouveau/nouvel, vieux/vieil — the middle form appears before a vowel sound."}
 ],
 grammar:[
  {h:"Which prepositions contract", x:"Only the ones ending in <b>de</b>: <i>à côté <b>du</b> salon</i>, <i>loin <b>du</b> centre</i>, <i>en face <b>du</b> parc</i>. Plain ones don't: <i>derrière la porte</i>, <i>devant l'immeuble</i>, <i>dans la cuisine</i>."},
  {h:"Il y a = there is / there are", x:"One form for both: <i>il y a un parc</i>, <i>il y a deux chambres</i>. Negative: <i>il n'y a pas de parc</i> — and des/un become <b>de</b> after the negative."},
  {h:"avoir de la chance", x:"Another avoir expression where English uses \"to be\": <i>tu as de la chance</i> = you're lucky. Same family as avoir faim, avoir froid, avoir vingt ans."}
 ],
 task:"Give a tour of your own home in six sentences. Include at least three prepositions that contract and one that doesn't."
},
{
 id:'d7', tab:'7. Le nouveau voisin', level:'A1+ · élémentaire',
 title:"Le nouveau voisin — describing people",
 intro:"Two neighbours discuss someone who's just moved in. Listen for the switch between être and avoir.",
 lines:[
  {who:'Fatou', fr:"Tu as vu le nouveau voisin du deuxième ?", ph:"tew ah vew luh noo-voh vwah-zan dew duh-ZYEM", en:"Have you seen the new neighbour on the second floor?"},
  {who:'Paul', fr:"Non, il est comment ?", ph:"nohn, eel eh koh-MAHN", en:"No, what's he like?"},
  {who:'Fatou', fr:"Il est grand et assez mince. Il a les cheveux courts et bruns.", ph:"eel eh grahn ay ah-say MANSS. eel ah lay shuh-vuh koor ay BRUHN", en:"He's tall and quite slim. He has short brown hair."},
  {who:'Paul', fr:"Il a quel âge, à peu près ?", ph:"eel ah kell AHZH, ah puh PREH", en:"Roughly how old is he?"},
  {who:'Fatou', fr:"Trente ans peut-être. Il porte toujours des lunettes rondes.", ph:"trahnt ahn puh-TEH-truh. eel port too-zhoor day lew-net ROHND", en:"Thirty maybe. He always wears round glasses."},
  {who:'Paul', fr:"Il est sympa ?", ph:"eel eh sam-PAH", en:"Is he nice?"},
  {who:'Fatou', fr:"Très ! Il est drôle et très poli. Il ressemble un peu à mon cousin.", ph:"TREH. eel eh drohl ay treh poh-LEE. eel ruh-sahm-bluh uhn puh ah mohn koo-ZAN", en:"Very! He's funny and very polite. He looks a bit like my cousin."},
  {who:'Paul', fr:"Il habite seul ?", ph:"eel ah-beet SUL", en:"Does he live alone?"},
  {who:'Fatou', fr:"Non, avec un chat énorme !", ph:"nohn, ah-vek uhn shah ay-NORM", en:"No, with an enormous cat!"}
 ],

  ["Il a quel âge ?","eel ah kell AHZH","How old is he?"],

 questions:[
  {q:"What does the neighbour look like?", opts:["Short with long blond hair","Tall and slim with short brown hair","Tall with a beard"], a:1, why:"« grand et assez mince… les cheveux courts et bruns »."},
  {q:"Why « il est grand » but « il a les cheveux courts »?", opts:["être for build, avoir for hair and eyes","No reason","être is more polite"], a:0, why:"Build and height take être; hair and eyes take avoir + les + noun."},
  {q:"In « les lunettes rondes », why does rondes end in -es?", opts:["Because lunettes is feminine plural","Because glasses are round","It's a spelling error"], a:0, why:"lunettes is feminine and always plural, so the adjective takes -es."}
 ],
 grammar:[
  {h:"être vs avoir, one more time", x:"<b>être + adjective</b> for overall build: <i>il est grand, il est mince</i>. <b>avoir + les + noun + adjective</b> for hair and eyes: <i>il a les cheveux courts</i>. The adjective there agrees with <i>cheveux</i> (masculine plural), not with the person."},
  {h:"porter for what people wear", x:"<i>Il <b>porte</b> des lunettes</i> — wears. You can also say <i>il a des lunettes</i>, but porter is more precise."},
  {h:"ressembler à", x:"Always with <b>à</b>: <i>il ressemble <b>à</b> mon cousin</i>. And it contracts: <i>elle ressemble <b>au</b> professeur</i>."}
 ],
 task:"Describe someone in the room, or a friend, in five sentences — two with être, two with avoir, one with porter."
},

 id:'d8', tab:'8. La fête', level:'A2 · pré-intermédiaire',
 title:"La fête — apologising and complaining politely",
 intro:"The morning after a noisy party. Two ways of handling the same problem — one that escalates and one that doesn't.",
 lines:[
  {who:'Mme Blanc', fr:"Bonjour. Excusez-moi de vous déranger.", ph:"bohn-ZHOOR. ex-kew-zay mwah duh voo day-rahn-ZHAY", en:"Hello. Sorry to bother you."},
  {who:'Théo', fr:"Bonjour madame. Il y a un problème ?", ph:"bohn-ZHOOR mah-DAM. eel yah uhn proh-BLEM", en:"Hello madam. Is there a problem?"},
  {who:'Mme Blanc', fr:"Hier soir, il y avait beaucoup de bruit. Je n'ai pas pu dormir.", ph:"ee-yehr SWAHR, eel yah-veh boh-koo duh BRWEE. zhuh nay pah pew dor-MEER", en:"Last night there was a lot of noise. I couldn't sleep."},
  {who:'Théo', fr:"Oh, je suis vraiment désolé. C'était l'anniversaire de ma sœur.", ph:"oh, zhuh swee vray-mahn day-zoh-LAY. say-teh lah-nee-vehr-sehr duh mah SUR", en:"Oh, I'm really sorry. It was my sister's birthday."},
  {who:'Mme Blanc', fr:"Je comprends, mais il était deux heures du matin.", ph:"zhuh kohm-PRAHN, meh zeel ay-teh duh zur dew mah-TAN", en:"I understand, but it was two in the morning."},
  {who:'Théo', fr:"Vous avez raison. Ça ne se reproduira plus, je vous promets.", ph:"voo-zah-vay ray-ZOHN. sah nuh suh ruh-proh-dwee-rah PLEW", en:"You're right. It won't happen again, I promise."},
  {who:'Mme Blanc', fr:"Merci. Ce n'est pas grave, mais prévenez-moi la prochaine fois.", ph:"mehr-SEE. suh neh pah GRAHV, meh pray-vuh-nay mwah lah proh-shen FWAH", en:"Thank you. It's not a problem, but let me know next time."},
  {who:'Théo', fr:"Bien sûr. Encore désolé !", ph:"byan SEWR. ahn-kor day-zoh-LAY", en:"Of course. Sorry again!"}
 ],

 ],
 questions:[
  {q:"Why couldn't Mme Blanc sleep?", opts:["She was ill","There was a lot of noise","She was working"], a:1, why:"« il y avait beaucoup de bruit » — the party next door."},
  {q:"How does Théo respond to the complaint?", opts:["He denies it","He apologises and promises it won't happen again","He blames his sister"], a:1, why:"He apologises, explains, accepts she's right, and promises. That's the full de-escalation sequence."},
  {q:"« Excusez-moi de vous déranger » — why start with this?", opts:["It softens the complaint before it lands","It's required by law","It means the same as bonjour"], a:0, why:"French complaints almost always open with an apology for the intrusion. Skipping it makes the complaint sound aggressive."}
 ],
 grammar:[
  {h:"How to complain without a fight", x:"The whole structure: <b>apologise for intruding</b> (excusez-moi de vous déranger) → <b>state the facts</b> (il y avait du bruit) → <b>say the effect on you</b> (je n'ai pas pu dormir). No accusation anywhere. Then the other side apologises and promises."},
  {h:"il y avait = there was", x:"The past of <i>il y a</i>. You'll hear it constantly: <i>il y avait beaucoup de monde</i> (there were a lot of people)."},
  {h:"Ce n'est pas grave", x:"The standard way to accept an apology. In speech the <i>ne</i> drops: <b>c'est pas grave</b>."}
 ],
 task:"Role-play both sides: complain about noise without being rude, then apologise convincingly. Use « excusez-moi de vous déranger » and « ça ne se reproduira plus »."
},

 grammar:[

/* ===== render ===== */
const tabsEl = document.getElementById('dtabs');
const stage = document.getElementById('stage');
let playing = false, timer = null;

function stopAll(){
  playing = false;
  if(timer){ clearTimeout(timer); timer = null; }
  speechSynthesis.cancel();
  document.querySelectorAll('.dline.on').forEach(el=>el.classList.remove('on'));
}

function playDialogue(d, container){
  stopAll();
  playing = true;
  const rows = container.querySelectorAll('.dline');
  let i = 0;
  function step(){
    if(!playing) return;
    if(i >= d.lines.length){ stopAll(); return; }
    rows.forEach(r=>r.classList.remove('on'));
    const line = d.lines[i];
    if(line.fr === '— — —'){ i++; timer = setTimeout(step, 400); return; }
    rows[i].classList.add('on');
    rows[i].scrollIntoView({behavior:'smooth', block:'center'});
    const u = new SpeechSynthesisUtterance(clean(line.fr));
    u.lang='fr-FR'; if(frVoice) u.voice=frVoice; u.rate=rate;
    u.onend = ()=>{ i++; timer = setTimeout(step, 550); };
    u.onerror = ()=>{ i++; timer = setTimeout(step, 550); };
    speechSynthesis.speak(u);
  }
  step();
}

function renderDialogue(d){
  stopAll();
  stage.innerHTML = '';

  const head = document.createElement('div'); head.className='dhead';
  head.innerHTML = '<h2></h2><p></p>';
  head.querySelector('h2').innerHTML = d.title + '<span class="lvbadge">'+d.level+'</span>';
  head.querySelector('p').textContent = d.intro;
  stage.appendChild(head);

  const btn = document.createElement('button'); btn.className='playall';
  btn.innerHTML = '▶ Écouter le dialogue';
  const stop = document.createElement('button'); stop.className='stopbtn'; stop.textContent = '■ Stop';
  stage.appendChild(btn); stage.appendChild(stop);

  const script = document.createElement('div'); script.className='script';
  d.lines.forEach(line=>{
    const row = document.createElement('div'); row.className='dline';
    const who = document.createElement('div'); who.className='who'; who.textContent = line.who;
    const body = document.createElement('div'); body.className='body';
    body.innerHTML = '<div class="fr"></div>'+(line.ph?'<div class="ph"></div>':'')+'<div class="en"></div>';
    body.querySelector('.fr').textContent = line.fr;
    if(line.ph) body.querySelector('.ph').textContent = line.ph;
    body.querySelector('.en').textContent = line.en;
    if(line.fr !== '— — —') body.onclick = ()=>{ stopAll(); speak(line.fr); };
    row.appendChild(who); row.appendChild(body);
    script.appendChild(row);
  });
  stage.appendChild(script);
  btn.onclick = ()=> playDialogue(d, script);
  stop.onclick = stopAll;

  const hint = document.createElement('div'); hint.className='note';
  hint.innerHTML = "Press <b>Écouter le dialogue</b> and the whole conversation is read aloud, highlighting each line as it goes. Click any single line to hear just that one. Switch to <b>Slow</b> above if it runs away from you.";
  stage.appendChild(hint);

  const gh = document.createElement('h3'); gh.className='sub2'; gh.textContent='Glossaire — every phrase from the dialogue';
  stage.appendChild(gh);
  d.gloss.forEach(([fr,ph,en])=> stage.appendChild(makeRow(fr,ph,en)));

  const qh = document.createElement('h3'); qh.className='sub2'; qh.textContent='Compréhension';
  stage.appendChild(qh);
  d.questions.forEach(it=>{
    const box=document.createElement('div'); box.className='mcq';
    const q=document.createElement('div'); q.className='q'; q.textContent=it.q;
    box.appendChild(q);
    const why=document.createElement('div'); why.className='why';
    it.opts.forEach((o,i)=>{
      const b=document.createElement('button'); b.className='opt'; b.textContent=o;
      b.onclick=()=>{
        [...box.querySelectorAll('.opt')].forEach(x=>x.disabled=true);
        if(i===it.a) b.classList.add('correct');
        else { b.classList.add('wrong'); box.querySelectorAll('.opt')[it.a].classList.add('correct'); }
        why.textContent = it.why;
      };
      box.appendChild(b);
    });
    box.appendChild(why);
    stage.appendChild(box);
  });

  const grh = document.createElement('h3'); grh.className='sub2'; grh.textContent='La grammaire du dialogue';
  stage.appendChild(grh);
  d.grammar.forEach(g=>{
    const n=document.createElement('div'); n.className='note';
    n.innerHTML = '<b>'+g.h+'</b> — '+g.x;
    stage.appendChild(n);
  });

  const t=document.createElement('div'); t.className='example';
  t.innerHTML = '<b>À vous —</b> '+d.task;
  stage.appendChild(t);
}

DIALOGUES.forEach((d,idx)=>{
  const b=document.createElement('button');
  b.innerHTML = d.tab + '<span class="lv">'+d.level.split(' · ')[0]+'</span>';
  if(idx===0) b.classList.add('on');
  b.onclick=()=>{
    [...tabsEl.children].forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    renderDialogue(d);
    window.scrollTo({top:0,behavior:'smooth'});
  };
  tabsEl.appendChild(b);
});
renderDialogue(DIALOGUES[0]);

document.getElementById('speed').addEventListener('click',e=>{
  if(e.target.tagName!=='BUTTON') return;
  rate=parseFloat(e.target.dataset.rate);
  [...e.currentTarget.children].forEach(b=>b.classList.remove('on'));
  e.target.classList.add('on');
});
</script>

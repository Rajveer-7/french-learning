<script>
let rate = 1, frVoice = null;
function pickVoice(){
  const v = speechSynthesis.getVoices();
  frVoice = v.find(x=>/fr[-_]FR/i.test(x.lang)) || v.find(x=>/^fr/i.test(x.lang)) || null;
}
speechSynthesis.onvoiceschanged = pickVoice; pickVoice();
function speak(t){
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(String(t).replace(/\s+([!?])/g,'$1'));
  u.lang='fr-FR'; if(frVoice) u.voice=frVoice; u.rate=rate;
  speechSynthesis.speak(u);
}
function makeRow(fr, ph, en){
  const row=document.createElement('div'); row.className='row';
  const btn=document.createElement('button'); btn.className='play'; btn.textContent='\u25B6';
  const txt=document.createElement('div'); txt.className='txt';
  txt.innerHTML='<div class="fr"></div>'+(ph?'<div class="ph"></div>':'')+(en?'<div class="en"></div>':'');
  txt.querySelector('.fr').textContent=fr;
  if(ph) txt.querySelector('.ph').textContent=ph;
  if(en) txt.querySelector('.en').textContent=en;
  btn.onclick=()=>speak(fr); txt.querySelector('.fr').onclick=()=>speak(fr);
  row.appendChild(btn); row.appendChild(txt);
  return row;
}

const unitSel=document.getElementById('unitSel'), statusSel=document.getElementById('statusSel'),
      searchEl=document.getElementById('search'), grid=document.getElementById('tgrid'),
      panel=document.getElementById('panel'), statsEl=document.getElementById('stats');

const UNITS = [...new Set(TRACKS.map(t=>t.unit))];
unitSel.innerHTML = '<option value="all">All units</option>' + UNITS.map(u=>'<option>'+u+'</option>').join('');

let current = null;

function visibleTracks(){
  const u=unitSel.value, s=statusSel.value, q=searchEl.value.toLowerCase().trim();
  return TRACKS.filter(t=>{
    if(u!=='all' && t.unit!==u) return false;
    const documented = t.done || CONTENT[t.n];
    if(s==='done' && !documented) return false;
    if(s==='todo' && documented) return false;
    if(q){
      const hay=(t.n+' '+t.unit+' '+t.desc+' '+t.cue+' '+t.en).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

function renderGrid(){
  const list=visibleTracks();
  grid.innerHTML='';
  list.forEach(t=>{
    const b=document.createElement('button'); b.className='tbtn';
    const documented = t.done || CONTENT[t.n];
    b.innerHTML='<span class="dot'+(documented?' done':'')+'"></span>Piste '+t.n+'<span class="u">'+t.unit+'</span>';
    if(current && current.n===t.n) b.classList.add('on');
    b.onclick=()=>{ current=t; renderGrid(); renderPanel(t); panel.scrollIntoView({behavior:'smooth',block:'start'}); };
    grid.appendChild(b);
  });
  const total=TRACKS.length, done=TRACKS.filter(t=>t.done||CONTENT[t.n]).length;
  statsEl.textContent = list.length+' shown · '+done+' of '+total+' documented · '+(total-done)+' awaiting transcripts';
}

function renderPanel(t){
  panel.innerHTML='';
  const documented = t.done || CONTENT[t.n];
  const h=document.createElement('h2');
  h.innerHTML='Piste '+t.n+'<span class="badge '+(documented?'done':'todo')+'">'+(documented?'documented':'awaiting transcript')+'</span>';
  panel.appendChild(h);
  const meta=document.createElement('div'); meta.className='meta'; meta.textContent=t.unit+' · '+t.file;
  panel.appendChild(meta);

  const audio=document.createElement('audio'); audio.controls=true; audio.preload='none';
  const src=document.createElement('source'); src.src=t.file; src.type='audio/mpeg';
  audio.appendChild(src); panel.appendChild(audio);

  if(t.desc){ const d=document.createElement('p'); d.style.fontSize='14px'; d.textContent=t.desc; panel.appendChild(d); }
  if(t.cours){
    const cl=document.createElement('p');
    cl.innerHTML='Full class notes: <a class="crosslink" href="'+t.cours+'">open the Cours page \u2192</a>';
    panel.appendChild(cl);
  }
  if(t.cue){
    const hh=document.createElement('h3'); hh.className='sub2'; hh.textContent='Sample line from this track';
    panel.appendChild(hh);
    panel.appendChild(makeRow(t.cue, t.ph, t.en));
  }

  const C = CONTENT[t.n];
  if(C){
    if(C.summary){
      const hh=document.createElement('h3'); hh.className='sub2'; hh.textContent='What happens in this recording';
      panel.appendChild(hh);
      const s=document.createElement('div'); s.className='example'; s.textContent=C.summary; panel.appendChild(s);
    }
    if(C.gloss && C.gloss.length){
      const hh=document.createElement('h3'); hh.className='sub2'; hh.textContent='Word-by-word glossary';
      panel.appendChild(hh);
      C.gloss.forEach(([fr,ph,en])=>panel.appendChild(makeRow(fr,ph,en)));
    }
    if(C.questions && C.questions.length){
      const hh=document.createElement('h3'); hh.className='sub2'; hh.textContent='Questions & answers';
      panel.appendChild(hh);
      C.questions.forEach(q=>{
        const d=document.createElement('div'); d.className='qa';
        d.innerHTML='<div class="q"></div><div class="qen"></div>';
        d.querySelector('.q').textContent=q.q; d.querySelector('.qen').textContent=q.en;
        d.querySelector('.q').onclick=()=>speak(q.q);
        panel.appendChild(d);
        if(q.a) panel.appendChild(makeRow(q.a, q.aph||'', q.aen||''));
      });
    }
    if(C.grammar && C.grammar.length){
      const hh=document.createElement('h3'); hh.className='sub2'; hh.textContent='Grammar in this track';
      panel.appendChild(hh);
      C.grammar.forEach(g=>{
        const d=document.createElement('div'); d.className='note';
        d.innerHTML='<b>'+g.h+'</b> \u2014 '+g.x;
        panel.appendChild(d);
      });
    }
    if(C.practice && C.practice.length){
      const hh=document.createElement('h3'); hh.className='sub2'; hh.textContent='Say it yourself';
      panel.appendChild(hh);
      C.practice.forEach(([fr,ph,en])=>panel.appendChild(makeRow(fr,ph,en)));
    }
  } else {
    const cta=document.createElement('div'); cta.className='cta';
    cta.innerHTML='<b>Nothing documented for this track yet.</b><br>Send me the transcript for Piste '+t.n+' and this panel fills in with: a plain-English summary of what happens, a word-by-word glossary (every word, pronunciation + meaning), the comprehension questions with worked answers, and the grammar points it demonstrates.';
    panel.appendChild(cta);
  }
}

unitSel.onchange=renderGrid; statusSel.onchange=renderGrid; searchEl.oninput=renderGrid;
document.getElementById('speed').addEventListener('click',e=>{
  if(e.target.tagName!=='BUTTON') return;
  rate=parseFloat(e.target.dataset.rate);
  [...e.currentTarget.children].forEach(b=>b.classList.remove('on'));
  e.target.classList.add('on');
});

renderGrid();
renderPanel(TRACKS.find(t=>t.n===26) || TRACKS[0]);
current = TRACKS.find(t=>t.n===26) || TRACKS[0];
renderGrid();
</script>
<script src="french_glossary.js"></script>

<style>

  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; line-height:1.5; }

  .bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:18px; }
  .bar span { font-size:13px; color:var(--muted); }
  .toggle { display:inline-flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; }

  h2 { font-size:18px; margin:24px 0 6px; padding-bottom:6px; border-bottom:2px solid var(--line); }

  .row { display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin:8px 0; }

  .en { font-size:13px; color:var(--muted); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:8px; margin:10px 0; }

  .riddle .btns button { border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:8px; padding:7px 14px; font-size:14px; cursor:pointer; }
  .riddle .btns button:hover { border-color:var(--accent); }
  .riddle .fb { font-size:13px; margin-top:8px; }
  .riddle .fb.ok { color:#155c37; } .riddle .fb.bad { color:#a33; }
  .fillrow { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin:8px 0; }
  .fillrow .sent { font-size:15px; margin-bottom:8px; }
  .fillrow input { border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-size:14px; width:200px; }
  .fillrow button { border:1px solid var(--accent); background:var(--accent); color:#fff; border-radius:8px; padding:6px 12px; font-size:13px; cursor:pointer; margin-left:8px; }
  .fillrow .fb { font-size:13px; margin-top:8px; }
  .fillrow .fb.ok { color:#155c37; } .fillrow .fb.bad { color:#a33; }
  .quizbox { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin:14px 0; }
  .quizbtn { border:1px solid var(--accent); background:var(--accent); color:#fff; border-radius:999px; padding:9px 16px; font-size:14px; cursor:pointer; }
  .quizarea { margin-top:12px; }
  .quizprog { font-size:12px; color:var(--muted); margin-bottom:8px; }
  .quizfr { font-size:17px; font-weight:600; margin-bottom:10px; }
  .quizopt { display:block; width:100%; text-align:left; border:1px solid var(--line); background:#fff; border-radius:10px; padding:9px 12px; margin:6px 0; font-size:14px; cursor:pointer; }

  .quizopt.wrong { background:#fdeceb; border-color:#d9534f; color:#a33; }

  .quizretry { border:1px solid var(--line); background:#fff; border-radius:999px; padding:7px 14px; font-size:13px; cursor:pointer; }
  .pending { background:#f4f2ee; border:1px dashed #c9c4b8; border-radius:10px; padding:10px 12px; font-size:13px; color:var(--muted); margin:12px 0; }
  .reading { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin:10px 0; }
  .reading p { margin:0 0 10px; }

  .tkbox { background:var(--card); border:2px solid var(--accent); border-radius:14px; padding:14px 16px; margin:0 0 22px; }
  .tkhead { font-size:17px; color:var(--accent); margin-bottom:10px; }
  .tktodo { background:var(--accentbg); border-radius:10px; padding:12px 14px; font-size:14px; line-height:1.6; margin-bottom:14px; }
  .tktab { width:100%; border-collapse:collapse; font-size:13px; }
  .tktab th { text-align:center; padding:6px 4px; border-bottom:2px solid var(--line); font-size:12px; color:var(--muted); font-weight:600; }
  .tktab th span { font-weight:400; font-size:10px; }
  .tktab td { padding:4px; border-bottom:1px solid var(--line); text-align:center; }
  .tktab td.nm { text-align:left; font-size:13px; }
  .tkb { font-size:11px; padding:4px 8px; min-width:52px; border:1px solid var(--line); background:var(--bg); color:var(--muted); border-radius:6px; cursor:pointer; }
  .tkb.done { background:var(--green); color:#fff; border-color:var(--green); font-weight:600; }
  .tktab td.st { font-size:12px; color:var(--muted); white-space:nowrap; }
  .tktab td.st.ok { color:var(--green); font-weight:600; }
  .tktab td.st.mid { color:var(--accent); }
  .tktab td.st.warn { color:#b45309; font-weight:600; }
  .tkfoot { margin-top:10px; font-size:12px; color:var(--muted); display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .tkreset { font-size:12px; padding:4px 10px; border:1px solid var(--line); background:var(--bg); color:var(--muted); border-radius:6px; cursor:pointer; }

<script>



let rate = 1, frVoice = null;
function pickVoice(){
  const v = speechSynthesis.getVoices();
  frVoice = v.find(x=>/fr[-_]FR/i.test(x.lang)) || v.find(x=>/^fr/i.test(x.lang)) || null;
  const s = document.getElementById('voiceStatus');
  if (frVoice) s.textContent = "\u{1F50A} " + frVoice.name;
  else if (v.length) s.textContent = "⚠ no French voice — see Cours 1 page";
}
speechSynthesis.onvoiceschanged = pickVoice; pickVoice();
function utter(text){
  const u = new SpeechSynthesisUtterance(String(text).replace(/\s+([!?])/g,'$1').replace(/___/g,''));
  u.lang='fr-FR'; if(frVoice) u.voice=frVoice; u.rate=(r||rate); return u;
}
function speak(text, r){ speechSynthesis.cancel(); speechSynthesis.speak(utter(text)); }

function makeRow(fr, ph, en){
  const row=document.createElement('div'); row.className='row';
  const btn=document.createElement('button'); btn.className='play'; btn.textContent='▶';
  const txt=document.createElement('div'); txt.className='txt';
  txt.innerHTML='<div class="fr"></div>'+(ph?'<div class="ph"></div>':'')+(en?'<div class="en"></div>':'');
  txt.querySelector('.fr').textContent=fr;
  if(ph) txt.querySelector('.ph').textContent=ph;
  if(en) txt.querySelector('.en').textContent=en;
  btn.onclick=()=>speak(fr); txt.querySelector('.fr').onclick=()=>speak(fr);
  row.appendChild(btn); row.appendChild(txt);
  return row;
}

const content = document.getElementById('content');
const GLOBAL_VOCAB = [];
/* ===== helpers for this page ===== */
function h2(t){ const e=document.createElement('h2'); e.textContent=t; content.appendChild(e); }
function h3(t){ const e=document.createElement('h3'); e.className='sub2'; e.textContent=t; content.appendChild(e); }
function lead(t){ const e=document.createElement('p'); e.className='lead'; e.innerHTML=t; content.appendChild(e); }
function note(t){ const e=document.createElement('div'); e.className='note'; e.innerHTML=t; content.appendChild(e); }
function ex(t){ const e=document.createElement('div'); e.className='example'; e.innerHTML=t; content.appendChild(e); }
function warn(t){ const e=document.createElement('div'); e.className='warn'; e.innerHTML=t; content.appendChild(e); }
function src(t){ const e=document.createElement('div'); e.className='source'; e.innerHTML=t; content.appendChild(e); }
function rows(list){ list.forEach(([fr,ph,en])=>{ content.appendChild(makeRow(fr,ph,en)); GLOBAL_VOCAB.push({fr:fr,en:en}); }); }
function grid(list){
  const g=document.createElement('div'); g.className='grid';
  list.forEach(([fr,ph])=>{
    const c=document.createElement('div'); c.className='cell';
    c.innerHTML='<div class="fr"></div><div class="ph"></div>';
    c.querySelector('.fr').innerHTML=fr; c.querySelector('.ph').innerHTML=ph;
    const plain=String(fr).replace(/<[^>]*>/g,'').replace(/\s*—.*$/,'').trim();
    c.onclick=()=>speak(plain); g.appendChild(c);
  });
  content.appendChild(g);
}
function table(head, body){
  const t=document.createElement('table'); t.className='conjt';
  let html='<tr>'+head.map(h=>'<th>'+h+'</th>').join('')+'</tr>';
  body.forEach(r=>{ html+='<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>'; });
  t.innerHTML=html; content.appendChild(t);
}
function fill(items){
  items.forEach(it=>{
    const d=document.createElement('div'); d.className='fillrow';
    const s=document.createElement('div'); s.className='sent'; s.innerHTML=it.s;
    const inp=document.createElement('input'); inp.placeholder='...';
    const btn=document.createElement('button'); btn.textContent='Check';
    const fb=document.createElement('div'); fb.className='fb';
    function check(){
      const v=inp.value.trim().toLowerCase().replace(/\s+/g,' ').replace(/[.?!]$/,'');
      const ok=it.a.some(a=>a.toLowerCase()===v);
      if(ok){ fb.className='fb ok'; fb.innerHTML='✓ '+it.a[0]+' — '+it.why; speak(it.a[0]); }
      else { fb.className='fb bad'; fb.innerHTML='✗ Answer: <b>'+it.a[0]+'</b> — '+it.why; }
    }
    btn.onclick=check;
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter') check(); });
    d.appendChild(s);
    const line=document.createElement('div'); line.appendChild(inp); line.appendChild(btn);
    d.appendChild(line);
    if(it.en){ const t=document.createElement('div'); t.className='en'; t.style.marginTop='6px'; t.textContent=it.en; d.appendChild(t); }
    d.appendChild(fb);
    content.appendChild(d);
  });
}
function mcq(items){
  items.forEach(it=>{
    const d=document.createElement('div'); d.className='riddle';
    const p=document.createElement('div'); p.className='prompt'; p.innerHTML=it.q;
    const b=document.createElement('div'); b.className='btns';
    const fb=document.createElement('div'); fb.className='fb';
    it.opts.forEach((o,i)=>{
      const btn=document.createElement('button'); btn.textContent=o;
      btn.onclick=()=>{
        if(i===it.a){ fb.className='fb ok'; fb.innerHTML='✓ '+o+' — '+it.why; speak(o); }
        else { fb.className='fb bad'; fb.innerHTML='✗ The answer is <b>'+it.opts[it.a]+'</b> — '+it.why; }
      };
      b.appendChild(btn);
    });
    d.appendChild(p); d.appendChild(b); d.appendChild(fb);
    content.appendChild(d);
  });
}


/* ===== 1 ===== */
function fillx(list){ fill(list.map(x=>({s:x[0], a:[x[1]], en:x[2]||'', why:x[3]||('Réponse : <b>'+x[1]+'</b>')}))); }
function mcqx(list){ mcq(list.map(x=>({q:x[0], opts:x[1], a:x[2], why:x[3]||''}))); }

function read(paras){
  const d=document.createElement('div'); d.className='reading';
  paras.forEach(t=>{
    const el=document.createElement('p'); el.innerHTML=t; el.style.cursor='pointer';
    const plain=String(t).replace(/<[^>]*>/g,'');
    el.onclick=()=>speak(plain);
    d.appendChild(el);
  });
  content.appendChild(d);
}

function dict(items){
  items.forEach((it,n)=>{
    const d=document.createElement('div'); d.className='fillrow';
    const top=document.createElement('div'); top.className='sent';
    top.innerHTML='<b>'+(n+1)+'.</b> Écoutez, puis écrivez ce que vous entendez. <i>(Listen, then write what you hear.)</i>';
    const bar=document.createElement('div'); bar.style.cssText='display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0';
    const pb=document.createElement('button'); pb.textContent='▶ Écouter'; pb.onclick=()=>speak(it.fr);
    const sb=document.createElement('button'); sb.textContent='▶ Lentement'; sb.onclick=()=>speak(it.fr,0.55);
    const inp=document.createElement('input'); inp.placeholder='Écrivez ici…'; inp.style.flex='1';
    const cb=document.createElement('button'); cb.textContent='Vérifier';
    const fb=document.createElement('div'); fb.className='fb';
    function norm(s){ return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim(); }
    cb.onclick=()=>{
      if(norm(inp.value)===norm(it.fr)){ fb.className='fb ok'; fb.innerHTML='✓ <b>'+it.fr+'</b><br>'+(it.en||'')+(it.why?'<br><i>'+it.why+'</i>':''); }
      else { fb.className='fb bad'; fb.innerHTML='✗ Réponse : <b>'+it.fr+'</b><br>'+(it.en||'')+(it.why?'<br><i>'+it.why+'</i>':''); }
    };
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter') cb.onclick(); });
    bar.appendChild(pb); bar.appendChild(sb); bar.appendChild(inp); bar.appendChild(cb);
    d.appendChild(top); d.appendChild(bar); d.appendChild(fb);
    content.appendChild(d);
  });
}

h2('1 · La réponse honnête : les chapitres suffisent-ils ?');
warn("<b>Non. Ils font environ 60 à 70 % du travail — et c’est la bonne partie.</b><br><br>Les chapitres contiennent les connaissances, les exemples, les exercices, les lectures. Rien dedans n’est perdu, et ils restent votre colonne vertébrale.<br><br><b>Mais il y a trois choses qu’ils ne peuvent pas faire, structurellement :</b><br><br><b>1 · Entraîner votre oreille à la parole imprévisible.</b> Mes dictées utilisent une voix de synthèse qui dit des phrases que j’ai écrites. Le TCF passe de vraies personnes, à vitesse réelle, une seule fois, avec parfois l’accent québécois. Seul du vrai audio corrige ça.<br><br><b>2 · Vous faire parler à un humain.</b> L’expression orale est la compétence qui plafonne le plus vite sans interlocuteur. Et c’est une des quatre que IRCC regarde séparément.<br><br><b>3 · Simuler la pression.</b> Tenir 2 h 47 de concentration est en soi une compétence, et elle s’entraîne à part.<br><br><b>Donc : les chapitres sont la colonne vertébrale. L’écoute réelle et la conversation sont les deux jambes.</b>");
note("<b>Mais je pense que le vrai problème est ailleurs.</b><br><br>Si vous avez l’impression que les chapitres ne suffisent pas, ce n’est probablement pas une question de <u>couverture</u>. C’est que vous les avez <b>lus</b>.<br><br>Lire un chapitre ne fait presque rien. Ça <i>ressemble</i> à du travail — c’est fatigant, les mots sont difficiles — mais à la fin vous avez <b>reconnu</b> beaucoup de français et vous n’en avez <b>produit</b> aucun.<br><br>Et la reconnaissance n’est pas ce que l’examen mesure.<br><br><b>Les chapitres sont faits pour être travaillés, pas lus.</b> Le reste de cette page explique la différence, concrètement.");

h2('2 · Les trois règles qui changent tout');
h3('Règle 1 — Tout à voix haute');
ex("<b>Chaque exemple, chaque ligne de vocabulaire, chaque phrase d’exercice.</b><br><br>Vous préparez une épreuve <u>orale</u>. La lecture silencieuse n’entraîne jamais la bouche, et la prononciation française demande des mouvements que votre bouche n’a jamais faits : le <b>u</b>, le <b>r</b>, les voyelles nasales. Ce sont des gestes musculaires — ils ne s’acquièrent qu’en les faisant.<br><br><b>Dans le bus :</b> murmurez. Ça suffit. Ce qui compte, c’est que les lèvres et la langue bougent, pas le volume.<br><br><b>Test :</b> si vous avez travaillé une heure sans qu’un son sorte de votre bouche, vous n’avez pas étudié pour un examen oral. Vous avez lu.");
h3('Règle 2 — Cachez la réponse AVANT de regarder');
warn("<b>C’est la règle la plus importante de cette page, et la plus désagréable à appliquer.</b><br><br>· Devant un exercice : produisez la réponse <u>dans votre tête ou à voix haute</u> avant de taper.<br>· Devant une liste de vocabulaire : cachez la colonne française avec la main et essayez de générer le mot.<br>· Devant un tableau de conjugaison : récitez les six formes avant de les lire.<br><br><b>Et quand vous vous trompez : tant mieux.</b><br><br>Se tromper puis voir la réponse ancre mieux que de voir la réponse directement. L’<u>effort de récupération raté</u> fait partie du mécanisme — ce n’est pas le signe que vous n’étiez pas prêt. C’est le travail lui-même.<br><br>C’est contre-intuitif et c’est ce que montrent le mieux les travaux sur le rappel actif : les activités qui amènent à <b>rappeler activement</b> la forme ou le sens produisent un apprentissage substantiel. Relire une liste n’en produit presque pas.");
h3('Règle 3 — Une phrase à vous par nouvelle chose');
ex("<b>Pas l’exemple du livre — le vôtre.</b><br><br>· Vous apprenez <i>le loyer</i> → écrivez <b>« Mon loyer est de mille quatre cents dollars par mois. »</b><br>· Vous apprenez l’imparfait → écrivez <b>« Quand j’étais à Jalandhar, je jouais au cricket dans la rue. »</b><br>· Vous apprenez <i>il va falloir</i> → écrivez <b>« Il va falloir travailler mon oral avant l’examen. »</b><br><br><b>Pourquoi ça marche :</b> un mot appris nu reste nu. Un mot appris dans une phrase sur votre propre vie ressort quand vous parlez — parce que c’est de votre vie qu’on vous demandera de parler, à la tâche 1 de l’oral comme dans la tâche 1 de l’écrit.<br><br>Vous apprenez le mot <u>et</u> vous préparez l’examen en même temps. C’est le meilleur rapport effort/résultat du livre.");

h2('3 · Un chapitre = trois passages, pas un');
warn("<b>C’est probablement le changement le plus rentable que vous puissiez faire.</b><br><br>La plupart des gens font <u>un</u> passage sur trente chapitres et se demandent pourquoi rien ne reste. <b>Douze chapitres faits en trois passages battent trente chapitres faits une fois</b> — et pas de peu.");
table(['Passage','Quand','Ce que vous faites','Objectif','Durée'],[
 ['<b>1</b>','jour 0','Lire à voix haute + tous les exercices + la lecture + la dictée','<b>Comprendre</b>','~2 h (un Trajet A)'],
 ['<b>2</b>','jour +3','<b>Réinitialiser</b> et refaire les exercices <u>seulement</u>. Ne pas relire.','<b>Récupérer</b>','15 min'],
 ['<b>3</b>','jour +7 à +21','Refaire la dictée, puis écrire 80 mots à vous avec la grammaire du chapitre','<b>Produire</b>','20 min']
]);
note("<b>Les trois objectifs sont vraiment différents.</b><br><br>· <b>Comprendre</b> — vous saisissez la règle et pourquoi elle est comme ça.<br>· <b>Récupérer</b> — vous retrouvez la règle sans aide, à froid, trois jours plus tard. C’est là que ça devient une mémoire et plus une impression.<br>· <b>Produire</b> — vous l’utilisez dans vos propres phrases, ce qui est la seule chose que l’examen vous demandera.<br><br><b>Un chapitre n’est pas « fait » après le passage 1.</b> Il est commencé.");
warn("<b>Au passage 2, vous allez vous tromper sur des choses que vous aviez réussies au passage 1.</b><br><br>Ce n’est pas un échec — c’est le système qui fonctionne. Ça vous montre ce que vous n’aviez pas vraiment appris, <u>pendant qu’il est encore temps</u>.<br><br><b>Les items que vous ratez en révision sont l’information la plus précieuse de tout le livre</b>, parce que ce sont exactement ceux qui vous auraient fait perdre des points en août.<br><br>Notez quels chapitres produisent des erreurs répétées. Ceux-là méritent un passage à J+21 et J+60. Les chapitres propres, laissez-les tranquilles.");

h2('4 · L’anatomie d’une séance de 2 heures');
lead('Le Trajet A, minute par minute. C’est le passage 1 d’un chapitre.');
table(['Minutes','Ce que vous faites','La règle qui s’applique'],[
 ['<b>0–10</b>','Lire les <b>Objectifs</b> et parcourir les titres de sections. Vous demander : qu’est-ce que je sais déjà là-dessus ?','La stratégie de lecture : activer le contexte d’abord'],
 ['<b>10–40</b>','Lire le chapitre <b>à voix haute</b>. Aux encadrés « pourquoi », ralentir — c’est ce qui fait tenir la règle.','Règle 1'],
 ['<b>40–60</b>','Le vocabulaire. Cliquer chaque ligne, répéter, <b>puis cacher le français et re-produire</b>.','Règle 2'],
 ['<b>60–90</b>','Les exercices. Produire la réponse <u>avant</u> de taper. Ne pas regarder la correction d’abord.','Règle 2'],
 ['<b>90–105</b>','La lecture + les questions de compréhension.','—'],
 ['<b>105–120</b>','La <b>dictée</b> : écrire, vérifier, <u>classer chaque erreur</u>.','voir §5'],
 ['<b>120–130</b>','<b>Révision espacée</b> : réinitialiser un ancien chapitre et refaire un bloc.','Passage 2']
]);
warn("<b>L’étape que tout le monde saute : écrire une phrase à soi.</b><br><br>Avant de fermer le chapitre, prenez <b>cinq minutes</b> et écrivez trois phrases vraies sur votre vie en utilisant ce que le chapitre vient d’enseigner.<br><br>Pas trois phrases du livre recopiées. Trois phrases sur <b>Brampton, Sobeys, votre famille en Inde, votre semaine</b>.<br><br>Ces phrases ont une double valeur : elles fixent la grammaire, et elles deviennent du matériel prêt à l’emploi pour l’oral. À la fin du livre vous aurez une centaine de phrases vraies sur vous — c’est exactement ce que la tâche 1 de l’expression orale demande.");

h2('5 · La dictée : l’exercice le plus rentable, bien fait');
ex("<b>La dictée force quatre compétences en même temps et n’en laisse esquiver aucune :</b><br><br>① <b>entendre</b> les sons · ② <b>découper</b> en mots · ③ <b>orthographier</b> · ④ appliquer la <b>grammaire</b><br><br>La lecture vous laisse sauter ① et ②. La conversation vous laisse sauter ③ et ④. La dictée, non.");
warn("<b>Mais la moitié de l’exercice, c’est le classement des erreurs — et personne ne le fait.</b><br><br>Quand vous vérifiez, ne vous contentez pas de voir que c’est faux. <b>Mettez chaque erreur dans une des trois cases :</b><br><br><b>1 · Je n’ai pas entendu le son.</b><br>→ problème d’<u>oreille</u>. Rejouez au ralenti dix fois, répétez par-dessus.<br><br><b>2 · J’ai entendu mais j’ai mal écrit.</b><br>→ problème d’<u>orthographe</u>. Réécrivez le mot cinq fois à la main.<br><br><b>3 · J’ai oublié un accord ou une terminaison.</b><br>→ problème de <u>grammaire</u>. Retournez au chapitre concerné.<br><br><b>Trois problèmes, trois remèdes complètement différents.</b> Sans ce tri, vous refaites la même erreur pendant six mois sans comprendre pourquoi.<br><br>Tenez une feuille à trois colonnes. Au bout de deux semaines, vous verrez que vos erreurs se concentrent dans <u>une</u> colonne — et ça vous dit sur quoi travailler. C’est une information que rien d’autre ne vous donnera.");

h2('6 · Quand vous n’avez que 15 minutes');
warn("<b>Ne commencez pas un nouveau chapitre. Faites le passage 2 d’un ancien.</b><br><br>Quinze minutes honnêtes de récupération sur le chapitre 9 valent plus que survoler le chapitre 18.<br><br><b>Pourquoi :</b> un nouveau chapitre survolé en 15 minutes vous laisse une impression de familiarité et zéro mémoire. Un ancien chapitre réinitialisé et refait à froid produit exactement le type d’effort qui fait tenir les choses.<br><br><b>Et la règle non négociable du plan :</b> jamais deux jours de suite à zéro. Un jour raté est un accident ; deux jours de suite, c’est le début d’un arrêt. Quinze minutes mauvaises valent infiniment mieux qu’une journée blanche.");
ex("<b>Trois versions de 15 minutes, selon ce que vous avez sous la main :</b><br><br><b>· Avec le téléphone et du calme</b> → réinitialiser un bloc d’exercices d’il y a 3 ou 7 jours et le refaire.<br><b>· Avec des écouteurs</b> → une dictée ancienne, refaite entièrement.<br><b>· Sans rien</b> → réciter à voix basse votre présentation de 2 minutes, puis répondre à trois des dix questions de l’oral.<br><br>La troisième ne demande ni écran, ni papier, ni réseau. Vous pouvez la faire en marchant.");

h2('7 · Ce que les chapitres ne font pas — et quoi mettre à la place');
table(['Ce qui manque','Pourquoi','Le remède','Quand commencer'],[
 ['<b>Vraie parole</b>','Ma voix de synthèse est trop régulière et trop lente','RFI <i>français facile</i> tous les jours + Radio-Canada une fois sur deux','<b>maintenant</b>'],
 ['<b>Conversation</b>','On ne peut pas apprendre à parler sans quelqu’un en face','Vos cours du soir, puis 30 min/semaine avec un tuteur ou un échange','<b>mois 5</b>'],
 ['<b>Pression d’examen</b>','2 h 47 de concentration, ça s’entraîne','Examens blancs chronométrés, sans pause','<b>mois 6</b>'],
 ['<b>Volume de lecture</b>','Les textes du livre sont conçus, pas authentiques','1jour1actu, puis Radio-Canada « en bref »','<b>mois 3</b>']
]);
note("<b>La répartition que je vous recommande, en pourcentage de votre temps :</b><br><br>· <b>50 %</b> — les chapitres du livre (passages 1, 2 et 3)<br>· <b>30 %</b> — écoute de vrai français, avec dictée et shadowing<br>· <b>15 %</b> — production écrite et orale à vous<br>· <b>5 %</b> — révision espacée d’anciens chapitres<br><br>Ce 5 % paraît dérisoire. C’est ce qui empêche les 95 % autres de s’évaporer.");

h2('8 · Les six erreurs de méthode');
warn("<b>1 · Lire au lieu de travailler.</b> Si rien n’est sorti de votre bouche et que vous n’avez rien tapé, vous avez lu.<br><br><b>2 · Regarder la réponse « pour vérifier qu’on savait ».</b> Vous ne saviez pas — vous reconnaissiez. Produisez d’abord, toujours.<br><br><b>3 · Considérer un chapitre comme fini après un passage.</b> Il est commencé, pas fini.<br><br><b>4 · Avancer vite pour « couvrir le programme ».</b> La couverture n’est pas la maîtrise. Douze chapitres solides battent trente chapitres survolés.<br><br><b>5 · Travailler ce qu’on aime.</b> Agréable et inutile : IRCC lit votre compétence la plus <u>faible</u>, pas la moyenne.<br><br><b>6 · Tout faire le dimanche.</b> Trois heures le dimanche valent moins que 30 minutes × 7 jours, pour le même total.");

h2('9 · Le test honnête — êtes-vous en train d’étudier ou de lire ?');
ex("<b>À la fin de chaque séance, répondez à ces cinq questions.</b><br><br>① Est-ce que j’ai <b>parlé à voix haute</b> ?<br>② Est-ce que j’ai <b>produit des réponses avant de les voir</b> ?<br>③ Est-ce que je me suis <b>trompé au moins une fois</b> ?<br>④ Est-ce que j’ai <b>écrit au moins une phrase à moi</b> ?<br>⑤ Est-ce que j’ai <b>revu quelque chose d’ancien</b> ?<br><br><b>Cinq oui</b> → c’était une vraie séance.<br><b>Trois ou quatre</b> → correct, mais il manque quelque chose.<br><b>Moins de trois</b> → vous avez lu, pas étudié. Ce n’est pas grave — mais ne comptez pas cette heure comme du travail.<br><br><b>La question ③ surprend toujours.</b> Si vous ne vous trompez jamais, c’est que le matériel est trop facile ou que vous regardez les réponses trop tôt. L’erreur n’est pas un accident dans l’apprentissage — c’est le signal que vous êtes au bon niveau de difficulté.");
src("<b>Sources.</b> Rappel actif et pratique espacée : méta-analyse sur la pratique espacée en langue seconde ; revue sur répétition, récupération et pratique espacée. Shadowing : revue systématique sur les apprenants d’anglais langue étrangère. Le découpage des séances, la méthode des trois passages, le classement des erreurs de dictée et les pourcentages de répartition sont mes recommandations, pas des résultats de recherche.");
/* ============ tableau de bord — suivi des chapitres ============ */
(function(){
  var TKEY='fr_tracker_v1';
  var CHAPTERS=[
    ['c01','Ch 1 · Les sons et l’alphabet'],['c02','Ch 2 · Se présenter'],
    ['c03','Ch 3 · Les nombres'],['c04','Ch 4 · ÊTRE et AVOIR'],
    ['c05','Ch 5 · Le genre et les articles'],['c06','Ch 6 · Poser une question'],
    ['at1','ATELIER 1 (ch. 1–6)'],
    ['c07','Ch 7 · La famille'],['c08','Ch 8 · Présent régulier'],
    ['c09','Ch 9 · Verbes irréguliers'],['c10','Ch 10 · Les adjectifs'],
    ['c11','Ch 11 · L’heure et la date'],['c12','Ch 12 · La négation'],
    ['at2','ATELIER 2 (ch. 7–12)'],
    ['c13','Ch 13 · Passé composé AVOIR'],['c14','Ch 14 · Passé composé ÊTRE'],
    ['c15','Ch 15 · L’imparfait'],['c16','Ch 16 · PC ou imparfait ?'],
    ['at3','ATELIER 3 (ch. 13–16)'],
    ['c17','Ch 17 · Le futur proche'],['c18','Ch 18 · L’impératif'],
    ['c19','Ch 19 · Les verbes pronominaux'],['c20','Ch 20 · Pronoms COD et COI'],
    ['c21','Ch 21 · Les pronoms Y et EN'],['c22','Ch 22 · Toniques et démonstratifs']
  ];
  var DB={};
  try{ DB=JSON.parse(localStorage.getItem(TKEY)||'{}')||{}; }catch(e){ DB={}; }
  function save(){ try{ localStorage.setItem(TKEY, JSON.stringify(DB)); }catch(e){} }
  function today(){ return new Date().toISOString().slice(0,10); }
  function days(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }

  var host=document.getElementById('tracker');
  if(!host) return;

  function render(){
    host.innerHTML='';
    var box=document.createElement('div'); box.className='tkbox';

    /* --- what to do today --- */
    var t=today(), todo=[], review=[], next=null;
    CHAPTERS.forEach(function(ch){
      var r=DB[ch[0]];
      if(!r||!r.p1){ if(!next) next=ch; return; }
      var age1=days(r.p1,t);
      if(!r.p2 && age1>=3) review.push([ch,2,age1]);
      else if(r.p2 && !r.p3 && days(r.p2,t)>=4) review.push([ch,3,age1]);
      else if(r.p3 && days(r.p3,t)>=40) review.push([ch,'R',age1]);
    });
    review.sort(function(a,b){ return b[2]-a[2]; });

    var h=document.createElement('div'); h.className='tkhead';
    h.innerHTML='▸ <b>Aujourd’hui</b> — '+t;
    box.appendChild(h);

    var todoEl=document.createElement('div'); todoEl.className='tktodo';
    var lines=[];
    if(next) lines.push('<b>Nouveau chapitre :</b> '+next[1]+' &nbsp;<i>(passage 1 — ~2 h)</i>');
    else lines.push('<b>Tous les chapitres construits sont commencés.</b> Concentrez-vous sur les révisions.');
    if(review.length){
      var r2=review.slice(0,2).map(function(x){
        var lbl = x[1]===2 ? 'passage 2 — réinitialiser + refaire les exercices (15 min)'
                : x[1]===3 ? 'passage 3 — dictée + 80 mots à vous (20 min)'
                : 'révision longue — réinitialiser et refaire (15 min)';
        return '<b>'+x[0][1]+'</b> — '+lbl;
      });
      lines.push('<b>À réviser :</b><br>· '+r2.join('<br>· '));
    } else {
      lines.push('<b>À réviser :</b> rien d’échu aujourd’hui. Faites 10 min sur le chapitre le plus ancien quand même.');
    }
    lines.push('<b>Toujours :</b> à voix haute · produire avant de regarder · une phrase à vous');
    todoEl.innerHTML=lines.join('<br><br>');
    box.appendChild(todoEl);

    /* --- the table --- */
    var tbl=document.createElement('table'); tbl.className='tktab';
    var html='<tr><th>Chapitre</th><th>P1<br><span>comprendre</span></th><th>P2<br><span>récupérer</span></th><th>P3<br><span>produire</span></th><th>État</th></tr>';
    CHAPTERS.forEach(function(ch){
      var id=ch[0], r=DB[id]||{};
      function cell(p){
        return '<td><button class="tkb'+(r[p]?' done':'')+'" data-id="'+id+'" data-p="'+p+'">'+(r[p]?r[p].slice(5):'—')+'</button></td>';
      }
      var state='—', cls='';
      if(r.p3){ state='✓ solide'; cls='ok'; }
      else if(r.p2){ state='en cours'; cls='mid'; }
      else if(r.p1){ var a=days(r.p1,today()); state = a>=3 ? '⚠ à revoir' : 'frais'; cls = a>=3?'warn':'mid'; }
      html+='<tr><td class="nm">'+ch[1]+'</td>'+cell('p1')+cell('p2')+cell('p3')+'<td class="st '+cls+'">'+state+'</td></tr>';
    });
    tbl.innerHTML=html;
    box.appendChild(tbl);

    var foot=document.createElement('div'); foot.className='tkfoot';
    foot.innerHTML='Cliquez une case pour marquer le passage fait aujourd’hui. Recliquez pour annuler. &nbsp;';
    var rb=document.createElement('button'); rb.className='tkreset'; rb.textContent='Tout effacer';
    rb.onclick=function(){ if(confirm('Effacer tout le suivi des chapitres ?')){ DB={}; save(); render(); } };
    foot.appendChild(rb);
    box.appendChild(foot);

    host.appendChild(box);

    [].forEach.call(box.querySelectorAll('.tkb'), function(b){
      b.onclick=function(){
        var id=b.dataset.id, p=b.dataset.p;
        DB[id]=DB[id]||{};
        if(DB[id][p]) delete DB[id][p]; else DB[id][p]=today();
        save(); render();
      };
    });
  }
  render();
})();

</script>
</body>
</html>

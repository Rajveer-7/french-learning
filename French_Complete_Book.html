<script>
/* ============ speech engine ============ */
let rate = 1, frVoice = null;
function pickVoice(){
  const v = speechSynthesis.getVoices();
  frVoice = v.find(x=>/fr[-_]FR/i.test(x.lang)) || v.find(x=>/^fr/i.test(x.lang)) || null;
  const s = document.getElementById('voiceStatus');
  if (frVoice) s.textContent = "🔊 " + frVoice.name;
  else if (v.length) s.textContent = "⚠ no French voice installed";
}
speechSynthesis.onvoiceschanged = pickVoice; pickVoice();
function clean(t){ return String(t).replace(/\s+([!?])/g,'$1').replace(/___/g,'').replace(/→/g,',').replace(/\(.*?\)/g,''); }
function speak(text){
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(clean(text));
  u.lang='fr-FR'; if(frVoice) u.voice=frVoice; u.rate=rate;
  speechSynthesis.speak(u);
}

/* ============ block builders ============ */
function elRow(fr, ph, en){
  const row=document.createElement('div'); row.className='row';
  const btn=document.createElement('button'); btn.className='play'; btn.textContent='▶'; btn.setAttribute('aria-label','Play '+fr);
  const txt=document.createElement('div'); txt.className='txt';
  txt.innerHTML='<div class="fr"></div>'+(ph?'<div class="ph"></div>':'')+(en?'<div class="en"></div>':'');
  txt.querySelector('.fr').textContent = fr;
  if(ph) txt.querySelector('.ph').textContent = ph;
  if(en) txt.querySelector('.en').textContent = en;
  btn.onclick=()=>speak(fr); txt.querySelector('.fr').onclick=()=>speak(fr);
  row.appendChild(btn); row.appendChild(txt);
  return row;
}
function elGrid(items){
  const g=document.createElement('div'); g.className='grid';
  items.forEach(([fr,ph])=>{
    const c=document.createElement('div'); c.className='cell';
    c.innerHTML='<div class="fr"></div><div class="ph"></div>';
    c.querySelector('.fr').textContent=fr; c.querySelector('.ph').textContent=ph||'';
    c.onclick=()=>speak(fr);
    g.appendChild(c);
  });
  return g;
}
function elTable(head, rows){
  const t=document.createElement('table'); t.className='t';
  let html='<tr>'+head.map(h=>'<th>'+h+'</th>').join('')+'</tr>';
  rows.forEach(r=>{ html+='<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>'; });
  t.innerHTML=html;
  return t;
}
function elFill(items){
  const box=document.createElement('div');
  items.forEach(it=>{
    const d=document.createElement('div'); d.className='fillrow';
    const s=document.createElement('div'); s.className='sent';
    s.innerHTML='<span></span>'+(it.en?'<div class="en"></div>':'');
    s.querySelector('span').textContent=it.s;
    if(it.en) s.querySelector('.en').textContent=it.en;
    const inp=document.createElement('input'); inp.placeholder='your answer';
    const b=document.createElement('button'); b.textContent='Check';
    const fb=document.createElement('div'); fb.className='fb';
    const answers=(Array.isArray(it.a)?it.a:[it.a]).map(x=>x.toLowerCase().trim());
    function check(){
      const val=inp.value.toLowerCase().trim();
      if(!val){ fb.textContent='Type something first.'; fb.className='fb'; return; }
      if(answers.some(a=>a===val)){ fb.textContent='✓ Correct — '+answers[0]+(it.why?' · '+it.why:''); fb.className='fb ok'; speak(it.s.replace('___',answers[0])); }
      else { fb.textContent='✗ Answer: '+answers[0]+(it.why?' · '+it.why:''); fb.className='fb bad'; }
    }
    b.onclick=check; inp.addEventListener('keydown',e=>{ if(e.key==='Enter') check(); });
    d.appendChild(s); d.appendChild(inp); d.appendChild(b); d.appendChild(fb);
    box.appendChild(d);
  });
  return box;
}
function elMcq(items){
  const box=document.createElement('div');
  items.forEach(it=>{
    const d=document.createElement('div'); d.className='mcq';
    const q=document.createElement('div'); q.className='q'; q.textContent=it.q;
    d.appendChild(q);
    const why=document.createElement('div'); why.className='why';
    it.opts.forEach((o,i)=>{
      const b=document.createElement('button'); b.className='opt'; b.textContent=o;
      b.onclick=()=>{
        [...d.querySelectorAll('.opt')].forEach(x=>x.disabled=true);
        if(i===it.a){ b.classList.add('correct'); }
        else { b.classList.add('wrong'); d.querySelectorAll('.opt')[it.a].classList.add('correct'); }
        if(it.why){ why.textContent=it.why; }
      };
      d.appendChild(b);
    });
    d.appendChild(why);
    box.appendChild(d);
  });
  return box;
}
function elReading(paras){
  const d=document.createElement('div'); d.className='reading';
  paras.forEach(p=>{
    const el=document.createElement('p'); el.textContent=p; el.style.cursor='pointer';
    el.onclick=()=>speak(p);
    d.appendChild(el);
  });
  return d;
}

function renderBlock(b){
  if(b.t==='p'){ const p=document.createElement('p'); p.className='txtp'; p.innerHTML=b.x; return p; }
  if(b.t==='h'){ const h=document.createElement('h3'); h.className='sub2'; h.textContent=b.x; return h; }
  if(b.t==='note'){ const d=document.createElement('div'); d.className='note'; d.innerHTML=b.x; return d; }
  if(b.t==='ex'){ const d=document.createElement('div'); d.className='example'; d.innerHTML=b.x; return d; }
  if(b.t==='warn'){ const d=document.createElement('div'); d.className='warn'; d.innerHTML=b.x; return d; }
  if(b.t==='rows'){ const f=document.createDocumentFragment(); b.items.forEach(([fr,ph,en])=>f.appendChild(elRow(fr,ph,en))); return f; }
  if(b.t==='grid'){ return elGrid(b.items); }
  if(b.t==='table'){ return elTable(b.head,b.rows); }
  if(b.t==='fill'){ return elFill(b.items); }
  if(b.t==='mcq'){ return elMcq(b.items); }
  if(b.t==='read'){ return elReading(b.paras); }
  return document.createTextNode('');
}

/* ============ the book ============ */
const BOOK = [];

BOOK.push({
  id:'p0', part:'Part 0 — Foundations', sub:'Before any grammar: the sounds, the letters, the numbers and the first words you need.',
  chapters:[
  { title:'0.1 · How French sound works (read this first)', blocks:[
    {t:'p', x:'French spelling and French sound are two different systems. A written word is often longer than what you actually say. Four rules explain most of it:'},
    {t:'p', x:'<b>1. Final consonants are usually silent.</b> The letters at the end of a word are often written but not pronounced.'},
    {t:'rows', items:[
      ['petit','puh-TEE','small (the final t is silent)'],
      ['grand','grahn','tall/big (the d is silent)'],
      ['français','frahn-SEH','French (the s is silent)'],
      ['beaucoup','boh-KOO','a lot (the p is silent)']
    ]},
    {t:'note', x:'Memory trick: the letters <b>C, R, F, L</b> ("CaReFuL") are the ones usually <i>kept</i> at the end: <i>avec</i> (ah-VEK), <i>bonjour</i> (bohn-ZHOOR), <i>chef</i> (shef), <i>il</i> (eel).'},
    {t:'p', x:'<b>2. Adding -e makes the consonant come back.</b> This is the whole basis of masculine vs feminine adjectives.'},
    {t:'rows', items:[
      ['petit → petite','puh-TEE → puh-TEET','small (m.) → small (f.)'],
      ['grand → grande','grahn → grahnd','big (m.) → big (f.)'],
      ['français → française','frahn-SEH → frahn-SEZ','French (m.) → French (f.)']
    ]},
    {t:'p', x:'<b>3. Liaison:</b> a silent final consonant wakes up when the next word starts with a vowel. The -s and -x are pronounced [z].'},
    {t:'rows', items:[
      ['les amis','lay-zah-MEE','the friends (les + a → [z])'],
      ['vous avez','voo-zah-VAY','you have'],
      ['un grand homme','uhn grahn-TOM','a tall man (d sounds like [t])'],
      ['deux enfants','duh-zahn-FAHN','two children']
    ]},
    {t:'p', x:'<b>4. Nasal vowels.</b> When a vowel is followed by <b>n</b> or <b>m</b> (and no other vowel after it), the sound goes through the nose and the n/m itself is not pronounced.'},
    {t:'rows', items:[
      ['un pain','uhn pan','a bread (nasal "an" sound)'],
      ['bon','bohn','good (nasal "oh")'],
      ['brun','bruhn','brown'],
      ['bonne','bun','good (f.) — the extra e kills the nasal, now you hear the n']
    ]},
    {t:'mcq', items:[
      {q:'How do you pronounce the final -t in "petit"?', opts:['You say it clearly','It is silent','It sounds like [s]'], a:1, why:'Final consonants are usually silent — until an -e is added (petite).'},
      {q:'"les amis" is pronounced…', opts:['lay ah-mee','lay-zah-mee','luh ah-mee'], a:1, why:'Liaison: the silent -s of les becomes [z] before a vowel.'}
    ]}
  ]},
  { title:'0.2 · The alphabet and spelling out loud', blocks:[
    {t:'p', x:'You will be asked to spell your name constantly — at the bank, at the pharmacy, on the phone. Tap each letter to hear it.'},
    {t:'grid', items:[['A','ah'],['B','bay'],['C','say'],['D','day'],['E','uh'],['F','eff'],['G','zhay'],['H','ash'],['I','ee'],['J','zhee'],['K','kah'],['L','ell'],['M','emm'],['N','enn'],['O','oh'],['P','pay'],['Q','kew'],['R','air'],['S','ess'],['T','tay'],['U','ew'],['V','vay'],['W','doo-bluh-vay'],['X','eeks'],['Y','ee-grek'],['Z','zed']]},
    {t:'note', x:'Careful with the pairs learners mix up most: <b>G</b> (zhay) vs <b>J</b> (zhee) — they are swapped compared to English. And <b>E</b> (uh) vs <b>I</b> (ee) vs <b>Y</b> (ee-grek, "Greek i").'},
    {t:'h', x:'Useful spelling phrases'},
    {t:'rows', items:[
      ['Comment ça s\'écrit ?','koh-MAHN sah say-KREE','How is that spelled?'],
      ['Vous pouvez épeler, s\'il vous plaît ?','voo poo-VAY ay-play, seel voo PLEH','Can you spell that, please?'],
      ['Ça s\'écrit R-A-J-V-E-E-R.','sah say-KREE','It is spelled R-A-J-V-E-E-R.'],
      ['en majuscule / en minuscule','ahn mah-zhew-SKEWL / ahn mee-new-SKEWL','in capitals / in lowercase'],
      ['deux L','duh ell','double L'],
      ['un trait d\'union','uhn treh dew-NYOHN','a hyphen'],
      ['un espace','uhn ess-PASS','a space']
    ]}
  ]},
  { title:'0.3 · Accents and the extra letters', blocks:[
    {t:'p', x:'Accents are not decoration — they change the sound, and sometimes the meaning.'},
    {t:'table', head:['Accent','Written','Sound','Example'],
      rows:[
      ['accent aigu','é','sharp "ay"','été (ay-TAY) — summer'],
      ['accent grave','è','open "eh"','mère (mehr) — mother'],
      ['accent grave (a/u)','à, où','no sound change, changes meaning','a (has) vs à (to) · ou (or) vs où (where)'],
      ['accent circonflexe','ê, â, î, ô, û','often a lost old "s"','forêt = forest · hôpital = hospital'],
      ['tréma','ë, ï','say both vowels separately','Noël (no-EL) — Christmas'],
      ['cédille','ç','makes c sound like [s]','français (frahn-SEH)']
      ]},
    {t:'ex', x:'Why ç exists: <b>c</b> before a, o, u is hard [k] (<i>café</i>). Add the cédille and it becomes soft [s]: <i>ça, garçon, français</i>. Before e or i, c is already soft — no cédille needed (<i>ceci, cinéma</i>).'},
    {t:'h', x:'Two-letter sounds worth learning now'},
    {t:'rows', items:[
      ['ou → nous','noo','"oo" as in food — we/us'],
      ['u → tu','tew','tight "ew" (round your lips, say "ee") — you'],
      ['ch → chat','shah','"sh" — cat'],
      ['gn → montagne','mohn-TAN-yuh','"ny" as in canyon — mountain'],
      ['ill → famille','fah-MEE-yuh','"y" sound — family'],
      ['eu → deux','duh','soft "uh" — two'],
      ['oi → moi','mwah','"wa" — me']
    ]},
    {t:'warn', x:'The single most important sound contrast for beginners: <b>tu</b> (tew) vs <b>tout</b> (too). If you cannot hear the difference yet, that is normal — round your lips as if saying "oo", then try to say "ee" without moving them. That is the French <b>u</b>.'},
    {t:'fill', items:[
      {s:'The word for "French" is written fran___ais (add the right letter).', a:['ç','c cédille','cedille'], en:'Hint: the c has to sound like [s] before "a".', why:'Cédille before a/o/u.'},
      {s:'"Mother" is written m___re (which accent goes on the e?).', a:['è','e grave','accent grave'], en:'The sound is an open "eh".', why:'mère — accent grave.'}
    ]}
  ]},
  { title:'0.4 · Numbers 0–100 (and beyond)', blocks:[
    {t:'p', x:'Numbers come up in every single conversation: prices, ages, phone numbers, addresses, times. Learn 1–20 solidly, then the tens.'},
    {t:'h', x:'0–20'},
    {t:'grid', items:[['0 zéro','ZAY-roh'],['1 un','uhn'],['2 deux','duh'],['3 trois','trwah'],['4 quatre','KATR'],['5 cinq','sank'],['6 six','seess'],['7 sept','set'],['8 huit','weet'],['9 neuf','nuhf'],['10 dix','deess'],['11 onze','ohnz'],['12 douze','dooz'],['13 treize','trez'],['14 quatorze','kah-TORZ'],['15 quinze','kanz'],['16 seize','sez'],['17 dix-sept','dee-SET'],['18 dix-huit','dee-ZWEET'],['19 dix-neuf','deez-NUHF'],['20 vingt','van']]},
    {t:'h', x:'The tens'},
    {t:'grid', items:[['30 trente','trahnt'],['40 quarante','kah-RAHNT'],['50 cinquante','san-KAHNT'],['60 soixante','swah-SAHNT'],['70 soixante-dix','swah-sahnt-DEESS'],['80 quatre-vingts','katr-uh-VAN'],['90 quatre-vingt-dix','katr-uh-van-DEESS'],['100 cent','sahn']]},
    {t:'note', x:'French does maths in the 70s–90s. <b>70 = 60+10</b> (soixante-dix), <b>71 = 60+11</b> (soixante et onze), <b>80 = 4×20</b> (quatre-vingts), <b>95 = 4×20+15</b> (quatre-vingt-quinze). Belgium and Switzerland use the easier <i>septante</i> (70) and <i>nonante</i> (90) — but France and Canada use the maths version, so learn that one.'},
    {t:'h', x:'Building any number'},
    {t:'rows', items:[
      ['21 vingt et un','van-tay-UHN','note: "et" appears only in 21, 31, 41, 51, 61, 71'],

BOOK.push({

  { title:'3.1 · Passé composé with AVOIR', blocks:[
    {t:'p', x:'The passé composé is the everyday past tense — "I ate", "I have eaten". It is built from two pieces: a helper verb in the present, plus a past participle.'},
    {t:'ex', x:'<b>Formula:</b> subject + <b>avoir (present)</b> + <b>past participle</b><br>J\'<b>ai</b> mang<b>é</b> — I ate / I have eaten.'},
    {t:'h', x:'Past participle endings for regular verbs'},
    {t:'table', head:['Verb group','Change','Example'],
      rows:[

      ['-ir verbs','-ir → <b>-i</b>','finir → fini, choisir → choisi'],
      ['-re verbs','-re → <b>-u</b>','vendre → vendu, attendre → attendu']

      ['Il n\'a rien dit.','eel nah ryan DEE','He said nothing.'],

  { title:'3.2 · Passé composé with ÊTRE (and the agreement)', blocks:[
    {t:'p', x:'A small group of verbs uses <b>être</b> instead of avoir. They are mostly verbs of movement and change of state — and with être, the participle agrees with the subject like an adjective.'},
    {t:'h', x:'The être verbs (learn them in opposite pairs)'},
    {t:'table', head:['Verb','Meaning','Verb','Meaning'],
      rows:[
      ['aller','to go','venir','to come'],
      ['arriver','to arrive','partir','to leave'],
      ['entrer','to enter','sortir','to go out'],
      ['monter','to go up','descendre','to go down'],
      ['naître','to be born','mourir','to die'],
      ['rester','to stay','tomber','to fall'],
      ['passer','to pass by','retourner','to return']
      ]},
    {t:'h', x:'The agreement in action'},
    {t:'rows', items:[
      ['Il est allé au marché.','eel eh tah-LAY','He went to the market.'],
      ['Elle est allée au marché.','ell eh tah-LAY','She went to the market. (+e)'],
      ['Ils sont allés au marché.','eel sohn tah-LAY','They (m.) went. (+s)'],
      ['Elles sont allées au marché.','ell sohn tah-LAY','They (f.) went. (+es)'],
      ['Je suis né en Inde.','zhuh swee NAY','I was born in India.'],
      ['Nous sommes partis à six heures.','noo sum par-TEE','We left at six.']
    ]},
    {t:'note', x:'The agreement is <b>silent</b> in almost every case — allé, allée, allés, allées all sound identical (ah-LAY). It matters for writing and for exams, not for being understood in speech.'},

    {t:'rows', items:[
      ['Je me suis levé(e) tôt.','zhuh muh swee luh-VAY','I got up early.'],

      ['Nous nous sommes reposés.','noo noo sum ruh-poh-ZAY','We rested.']

    {t:'warn', x:'Some verbs take <b>both</b>, with a meaning shift: <i>Je suis sorti</i> (I went out) vs <i>J\'ai sorti la poubelle</i> (I took out the bin). If the verb has a direct object, it flips to avoir.'},
    {t:'fill', items:[
      {s:'Elle est ___ à Paris. (aller)', a:['allée'], en:'She went to Paris.', why:'être verb + feminine subject → allée'},

  { title:'3.3 · Imparfait — the "used to / was doing" past', blocks:[
    {t:'p', x:'Formation is beautifully regular: take the <b>nous</b> form of the present, drop -ons, add the endings. One verb only is irregular (être → ét-).'},

    {t:'rows', items:[

      ['Il faisait très froid.','eel fuh-ZEH treh FRWAH','It was very cold.'],
      ['Nous allions à la plage chaque été.','noo-zah-LYOHN','We used to go to the beach every summer.'],
      ['Elle regardait la télé quand j\'ai téléphoné.','ruh-gar-DEH','She was watching TV when I called.']

    {t:'table', head:['Use imparfait for…','Use passé composé for…'],

      ]},
    {t:'ex', x:'Both in one sentence: <i>Je <b>dormais</b> quand le téléphone <b>a sonné</b>.</i> — I <b>was sleeping</b> (background, imparfait) when the phone <b>rang</b> (interrupting event, passé composé). This pattern alone answers most exam questions on the topic.'},

  { title:'3.4 · Object pronouns (le, la, les, lui, leur)', blocks:[

  { title:'3.5 · Comparing things', blocks:[

BOOK.push({
  id:'p4', part:'Part 4 — B1 Foundations',
  sub:'Politeness, hypotheses, opinions and longer sentences. This is the level TEF Canada and CLB 7 actually test.',
  chapters:[
  { title:'4.1 · Conditionnel — politeness and "would"', blocks:[
    {t:'p', x:'Formation is a gift: take the <b>future stem</b> (Part 3.6) and add the <b>imparfait endings</b>. Nothing new to memorise.'},

  ]},
  { title:'4.2 · SI clauses — the three hypotheses', blocks:[
    {t:'table', head:['Type','si + …','main clause','Meaning'],

/* ===== RENDER MARKER — new parts get pushed above this line ===== */

/* ============ renderer ============ */
const tabsEl = document.getElementById('parttabs');
const bookEl = document.getElementById('book');

function renderBook(){
  tabsEl.innerHTML=''; bookEl.innerHTML='';
  BOOK.forEach((part, idx)=>{
    const btn=document.createElement('button');
    btn.textContent=part.part.replace(' — ',' · ');
    btn.dataset.target=part.id;
    if(idx===0) btn.classList.add('on');
    btn.onclick=()=>{
      [...tabsEl.children].forEach(b=>b.classList.remove('on'));
      btn.classList.add('on');
      [...bookEl.children].forEach(sec=>sec.classList.toggle('hidden', sec.id!==part.id));
      window.scrollTo({top:0,behavior:'smooth'});
    };
    tabsEl.appendChild(btn);

    const sec=document.createElement('section'); sec.id=part.id;
    if(idx!==0) sec.classList.add('hidden');
    const head=document.createElement('div'); head.className='parthead';
    const h2=document.createElement('h2'); h2.textContent=part.part;
    const p=document.createElement('p'); p.textContent=part.sub||'';
    head.appendChild(h2); head.appendChild(p); sec.appendChild(head);

    const toc=document.createElement('div'); toc.className='tocbox';
    toc.innerHTML='<b>In this part:</b>';
    part.chapters.forEach((ch,ci)=>{
      const a=document.createElement('a'); a.href='#'; a.textContent=ch.title;
      a.onclick=(e)=>{ e.preventDefault();
        const d=sec.querySelectorAll('details.chap')[ci];
        d.open=true; d.scrollIntoView({behavior:'smooth',block:'start'});
      };
      toc.appendChild(a);
    });
    sec.appendChild(toc);

    part.chapters.forEach(ch=>{
      const d=document.createElement('details'); d.className='chap';
      const s=document.createElement('summary'); s.textContent=ch.title;
      const body=document.createElement('div'); body.className='chapbody';
      ch.blocks.forEach(b=>body.appendChild(renderBlock(b)));
      d.appendChild(s); d.appendChild(body);
      sec.appendChild(d);
    });
    bookEl.appendChild(sec);
  });
}
renderBook();

/* ============ search ============ */
document.getElementById('search').addEventListener('input', e=>{
  const q=e.target.value.toLowerCase().trim();
  const sections=[...bookEl.children];
  if(!q){
    sections.forEach((sec,i)=>{
      sec.classList.toggle('hidden', !tabsEl.children[i].classList.contains('on'));
      sec.querySelectorAll('details.chap').forEach(d=>{ d.classList.remove('hidden'); d.open=false; });
      sec.querySelectorAll('.row,.cell').forEach(r=>r.classList.remove('hidden'));
      const toc=sec.querySelector('.tocbox'); if(toc) toc.classList.remove('hidden');
    });
    return;
  }
  sections.forEach(sec=>{
    sec.classList.remove('hidden');
    const toc=sec.querySelector('.tocbox'); if(toc) toc.classList.add('hidden');
    let anyChap=false;
    sec.querySelectorAll('details.chap').forEach(d=>{
      let hits=0;
      d.querySelectorAll('.row,.cell').forEach(r=>{
        const match=r.textContent.toLowerCase().includes(q);
        r.classList.toggle('hidden', !match);
        if(match) hits++;
      });
      const titleMatch=d.querySelector('summary').textContent.toLowerCase().includes(q);
      const show=hits>0||titleMatch;
      d.classList.toggle('hidden', !show);
      d.open=show;
      if(show) anyChap=true;
    });
    sec.classList.toggle('hidden', !anyChap);
  });
});

/* ============ speed ============ */
document.getElementById('speed').addEventListener('click',e=>{
  if(e.target.tagName!=='BUTTON') return;
  rate=parseFloat(e.target.dataset.rate);
  [...e.currentTarget.children].forEach(b=>b.classList.remove('on'));
  e.target.classList.add('on');
});

<script>
/* ===== speech ===== */
let rate = 1, frVoice = null;
function pickVoice(){
  const v = speechSynthesis.getVoices();
  frVoice = v.find(x=>/fr[-_]FR/i.test(x.lang)) || v.find(x=>/^fr/i.test(x.lang)) || null;
  const s = document.getElementById('voiceStatus');
  if (frVoice) s.textContent = "\u{1F50A} " + frVoice.name;
  else if (v.length) s.textContent = "⚠ no French voice installed";
}
speechSynthesis.onvoiceschanged = pickVoice; pickVoice();
function clean(t){ return String(t).replace(/\s+([!?])/g,'$1').replace(/_+/g,'').replace(/\(.*?\)/g,'').replace(/→/g,','); }
function speak(text){
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(clean(text));
  u.lang='fr-FR'; if(frVoice) u.voice=frVoice; u.rate=rate;
  speechSynthesis.speak(u);
}

/* ===== block builders ===== */
function elRow(fr, ph, en){
  const row=document.createElement('div'); row.className='row';
  const btn=document.createElement('button'); btn.className='play'; btn.textContent='▶';
  const txt=document.createElement('div'); txt.className='txt';
  txt.innerHTML='<div class="fr"></div>'+(ph?'<div class="ph"></div>':'')+(en?'<div class="en"></div>':'');
  txt.querySelector('.fr').textContent = fr;
  if(ph) txt.querySelector('.ph').textContent = ph;
  if(en) txt.querySelector('.en').textContent = en;
  btn.onclick=()=>speak(fr); txt.querySelector('.fr').onclick=()=>speak(fr);
  row.appendChild(btn); row.appendChild(txt);
  return row;
}
function elGrid(items){
  const g=document.createElement('div'); g.className='grid';
  items.forEach(([fr,ph])=>{
    const c=document.createElement('div'); c.className='cell';
    c.innerHTML='<div class="fr"></div><div class="ph"></div>';
    c.querySelector('.fr').textContent=fr; c.querySelector('.ph').textContent=ph||'';
    c.onclick=()=>speak(fr);
    g.appendChild(c);
  });
  return g;
}
function elTable(head, rows){
  const t=document.createElement('table'); t.className='t';
  let html='<tr>'+head.map(h=>'<th>'+h+'</th>').join('')+'</tr>';
  rows.forEach(r=>{ html+='<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>'; });
  t.innerHTML=html; return t;
}
function elFill(items){
  const box=document.createElement('div');
  items.forEach(it=>{
    const d=document.createElement('div'); d.className='fillrow';
    const s=document.createElement('div'); s.className='sent';
    s.innerHTML='<span></span>'+(it.en?'<div class="en"></div>':'');
    s.querySelector('span').textContent=it.s;
    if(it.en) s.querySelector('.en').textContent=it.en;
    const inp=document.createElement('input'); inp.placeholder='your answer';
    const b=document.createElement('button'); b.textContent='Check';
    const fb=document.createElement('div'); fb.className='fb';
    const answers=(Array.isArray(it.a)?it.a:[it.a]).map(x=>String(x).toLowerCase().trim());
    function check(){
      const val=inp.value.toLowerCase().trim().replace(/\s+/g,' ');
      if(!val){ fb.textContent='Type something first.'; fb.className='fb'; return; }
      if(answers.some(a=>a===val)){
        fb.textContent='✓ Correct — '+answers[0]+(it.why?' · '+it.why:''); fb.className='fb ok';
        speak(it.s.replace('___',answers[0]));
      } else { fb.textContent='✗ Answer: '+answers[0]+(it.why?' · '+it.why:''); fb.className='fb bad'; }
    }
    b.onclick=check; inp.addEventListener('keydown',e=>{ if(e.key==='Enter') check(); });
    d.appendChild(s); d.appendChild(inp); d.appendChild(b); d.appendChild(fb);
    box.appendChild(d);
  });
  return box;
}
function elMcq(items){
  const box=document.createElement('div');
  items.forEach(it=>{
    const d=document.createElement('div'); d.className='mcq';
    const q=document.createElement('div'); q.className='q'; q.textContent=it.q;
    d.appendChild(q);
    const why=document.createElement('div'); why.className='why';
    it.opts.forEach((o,i)=>{
      const b=document.createElement('button'); b.className='opt'; b.textContent=o;
      b.onclick=()=>{
        [...d.querySelectorAll('.opt')].forEach(x=>x.disabled=true);
        if(i===it.a){ b.classList.add('correct'); }
        else { b.classList.add('wrong'); d.querySelectorAll('.opt')[it.a].classList.add('correct'); }
        if(it.why) why.textContent=it.why;
      };
      d.appendChild(b);
    });
    d.appendChild(why); box.appendChild(d);
  });
  return box;
}
function renderBlock(b){
  if(b.t==='p'){ const p=document.createElement('p'); p.className='txtp'; p.innerHTML=b.x; return p; }
  if(b.t==='h'){ const h=document.createElement('h3'); h.className='sub2'; h.textContent=b.x; return h; }
  if(b.t==='note'){ const d=document.createElement('div'); d.className='note'; d.innerHTML=b.x; return d; }
  if(b.t==='ex'){ const d=document.createElement('div'); d.className='example'; d.innerHTML=b.x; return d; }
  if(b.t==='warn'){ const d=document.createElement('div'); d.className='warn'; d.innerHTML=b.x; return d; }
  if(b.t==='src'){ const d=document.createElement('div'); d.className='srcline'; d.innerHTML=b.x; return d; }
  if(b.t==='rows'){ const f=document.createDocumentFragment(); b.items.forEach(([fr,ph,en])=>f.appendChild(elRow(fr,ph,en))); return f; }
  if(b.t==='grid'){ return elGrid(b.items); }
  if(b.t==='table'){ return elTable(b.head,b.rows); }
  if(b.t==='fill'){ return elFill(b.items); }
  if(b.t==='mcq'){ return elMcq(b.items); }
  return document.createTextNode('');
}

    {t:'note', x:"<b>turc / turque</b> is the odd one out — both are pronounced the same (tewrk), because the -c was already being said. And nationalities are <b>not capitalised</b> when used as adjectives: <i>je suis français</i>, lowercase."},

  { title:'2.4 · The four patterns — why the endings change', blocks:[
    {t:'p', x:"Nearly every nationality in French belongs to one of four families. Learn the family and you can produce the feminine of a word you've never seen."},
    {t:'table', head:['Pattern','Masculine','Feminine','What changes in sound'],
      rows:[
      ['<b>1. -ais / -ois</b>','français, anglais, chinois','française, anglaise, chinoise','the silent -s wakes up as <b>[z]</b>'],
      ['<b>2. -ain</b>','américain, marocain, mexicain','américaine, marocaine, mexicaine','nasal <b>an</b> → clear <b>en</b> + n'],
      ['<b>3. -ien</b>','indien, italien, canadien','indienne, italienne, canadienne','nasal <b>yan</b> → clear <b>yen</b> + n (double n in writing)'],
      ['<b>4. no change</b>','russe, belge, suisse, turc','russe, belge, suisse, turque','nothing — already ends in a sounded consonant or -e']
      ]},
    {t:'ex', x:"<b>The underlying rule is always the same.</b> French masculine forms end in a consonant you don't say. Adding <b>-e</b> forces you to say it. That's it — patterns 1, 2 and 3 are just three different consonants doing the same thing (s→[z], n→[n], n→[n])."},
    {t:'warn', x:"Pattern 4 catches people out because nothing changes in speech. <i>Il est russe / Elle est russe</i> — identical. <i>Il est belge / Elle est belge</i> — identical. Don't add an -e where there isn't one."},
    {t:'h', x:'Country → nationality → language'},
    {t:'table', head:['Le pays','Il est…','Elle est…','La langue'],
      rows:[
      ['la France','français','française','le français'],
      ["l'Angleterre",'anglais','anglaise',"l'anglais"],
      ["l'Inde",'indien','indienne','le hindi'],
      ['le Canada','canadien','canadienne','le français / l\'anglais'],
      ["l'Italie",'italien','italienne',"l'italien"],
      ["l'Espagne",'espagnol','espagnole',"l'espagnol"],
      ["l'Allemagne",'allemand','allemande',"l'allemand"],
      ['le Japon','japonais','japonaise','le japonais'],
      ['la Chine','chinois','chinoise','le chinois'],
      ['le Maroc','marocain','marocaine',"l'arabe"]
      ]},
    {t:'note', x:"Three different words, three different rules. <b>The country</b> takes an article (<i>la France</i>, <i>le Japon</i>) and a capital letter. <b>The nationality adjective</b> takes no article and no capital (<i>je suis français</i>). <b>The language</b> takes <i>le</i> and no capital (<i>je parle <b>le</b> français</i> — or just <i>je parle français</i>)."},
    {t:'warn', x:"Capital letters: <b>un Français</b> (a Frenchman, noun, capital) vs <b>il est français</b> (adjective, lowercase). At A1 you'll almost always want the lowercase adjective."}
  ]},

  { title:'2.6 · Texte parallèle — Le cours de français', blocks:[
    {t:'p', x:"An original short text written for this page, using only the language from this handout. Read it aloud, then answer without looking back."},
    {t:'ex', x:"<b>Le cours de français</b><br><br>Dans mon cours de français, nous sommes six étudiants. Marta est espagnole et elle habite à Valence. Kenji est japonais ; il est ingénieur. Il y a aussi Leila, elle est marocaine et elle parle arabe et français. Moi, je suis indien et je parle hindi et anglais. Notre professeure est française : elle s'appelle Madame Clément. Elle est très sympa. Le cours est le mardi et le jeudi soir."},

      ['il est ingénieur','eel eh tan-zhay-NYUR','he is an engineer'],
      ['il y a aussi','eel yah oh-SEE','there is also'],
      ['elle parle arabe et français','ell parl ah-RAB ay frahn-SEH','she speaks Arabic and French'],
      ['notre professeure','notr proh-feh-SUR','our teacher (f.)'],
      ['elle est très sympa','ell eh treh sam-PAH','she is very nice'],

      {q:"Qui parle arabe ?", opts:["Marta","Leila","Madame Clément"], a:1, why:"Leila — elle est marocaine et elle parle arabe et français."},
      {q:"Quand est le cours ?", opts:["Le lundi et le mercredi","Le mardi et le jeudi soir","Le week-end"], a:1, why:"« Le cours est le mardi et le jeudi soir »."}
    ]},
    {t:'h', x:'Repérez la grammaire'},
    {t:'note', x:"Find these in the text above:<br>· <b>Four nationalities</b>, and check the gender of each: <i>espagnole</i> (f.), <i>japonais</i> (m.), <i>marocaine</i> (f.), <i>indien</i> (m.), <i>française</i> (f.).<br>· <b>No article with nationality or job</b> — <i>il est ingénieur</i>, not \"un ingénieur\".<br>· <b>le + day = every week</b> — <i>le mardi</i> means \"on Tuesdays\", not \"on Tuesday\". Drop the <i>le</i> and it means one specific Tuesday.<br>· <b>Languages take no article after parler</b> — <i>elle parle arabe</i>."},

/* ===== RENDER MARKER ===== */

/* ===== renderer ===== */
const tabsEl = document.getElementById('parttabs');
const bookEl = document.getElementById('book');
function renderBook(){
  tabsEl.innerHTML=''; bookEl.innerHTML='';
  BOOK.forEach((part, idx)=>{
    const btn=document.createElement('button');
    btn.textContent=part.part.split(' — ')[0];
    if(idx===0) btn.classList.add('on');
    btn.onclick=()=>{
      [...tabsEl.children].forEach(b=>b.classList.remove('on'));
      btn.classList.add('on');
      [...bookEl.children].forEach(sec=>sec.classList.toggle('hidden', sec.id!==part.id));
      window.scrollTo({top:0,behavior:'smooth'});
    };
    tabsEl.appendChild(btn);

    const sec=document.createElement('section'); sec.id=part.id;
    if(idx!==0) sec.classList.add('hidden');
    const head=document.createElement('div'); head.className='parthead';
    const h2=document.createElement('h2'); h2.textContent=part.part;
    const p=document.createElement('p'); p.textContent=part.sub||'';
    head.appendChild(h2); head.appendChild(p); sec.appendChild(head);

    const toc=document.createElement('div'); toc.className='tocbox';
    toc.innerHTML='<b>In this handout:</b>';
    part.chapters.forEach((ch,ci)=>{
      const a=document.createElement('a'); a.href='#'; a.textContent=ch.title;
      a.onclick=(e)=>{ e.preventDefault();
        const d=sec.querySelectorAll('details.chap')[ci];
        d.open=true; d.scrollIntoView({behavior:'smooth',block:'start'});
      };
      toc.appendChild(a);
    });
    sec.appendChild(toc);

    part.chapters.forEach(ch=>{
      const d=document.createElement('details'); d.className='chap';
      const s=document.createElement('summary'); s.textContent=ch.title;
      const body=document.createElement('div'); body.className='chapbody';
      ch.blocks.forEach(b=>body.appendChild(renderBlock(b)));
      d.appendChild(s); d.appendChild(body);
      sec.appendChild(d);
    });
    bookEl.appendChild(sec);
  });
}
renderBook();

/* ===== search ===== */
document.getElementById('search').addEventListener('input', e=>{
  const q=e.target.value.toLowerCase().trim();
  const sections=[...bookEl.children];
  if(!q){
    sections.forEach((sec,i)=>{
      sec.classList.toggle('hidden', !tabsEl.children[i].classList.contains('on'));
      sec.querySelectorAll('details.chap').forEach(d=>{ d.classList.remove('hidden'); d.open=false; });
      sec.querySelectorAll('.row,.cell').forEach(r=>r.classList.remove('hidden'));
      const toc=sec.querySelector('.tocbox'); if(toc) toc.classList.remove('hidden');
    });
    return;
  }
  sections.forEach(sec=>{
    sec.classList.remove('hidden');
    const toc=sec.querySelector('.tocbox'); if(toc) toc.classList.add('hidden');
    let any=false;
    sec.querySelectorAll('details.chap').forEach(d=>{
      let hits=0;
      d.querySelectorAll('.row,.cell').forEach(r=>{
        const m=r.textContent.toLowerCase().includes(q);
        r.classList.toggle('hidden', !m); if(m) hits++;
      });
      const tm=d.querySelector('summary').textContent.toLowerCase().includes(q);
      const show=hits>0||tm;
      d.classList.toggle('hidden', !show); d.open=show;
      if(show) any=true;
    });
    sec.classList.toggle('hidden', !any);
  });
});

document.getElementById('speed').addEventListener('click',e=>{
  if(e.target.tagName!=='BUTTON') return;
  rate=parseFloat(e.target.dataset.rate);
  [...e.currentTarget.children].forEach(b=>b.classList.remove('on'));
  e.target.classList.add('on');
});

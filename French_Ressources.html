<style>
  :root { --bg:#faf9f7; --card:#fff; --line:#e6e3dc; --ink:#23201b; --muted:#6b675f; --accent:#4338ca; --accentbg:#eceafe; --green:#0f7a54; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; line-height:1.5; }

  nav { display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; }
  nav a { text-decoration:none; font-size:14px; padding:8px 14px; border:1px solid var(--line); border-radius:999px; color:var(--ink); background:var(--card); }
  nav a.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:18px; }
  .bar span { font-size:13px; color:var(--muted); }
  .toggle { display:inline-flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; }
  .toggle button { border:none; background:var(--card); padding:6px 14px; font-size:13px; cursor:pointer; color:var(--ink); }
  .toggle button.on { background:var(--accent); color:#fff; }
  h2 { font-size:18px; margin:24px 0 6px; padding-bottom:6px; border-bottom:2px solid var(--line); }
  h3.sub2 { font-size:15px; margin:16px 0 6px; color:var(--accent); }
  .lead { font-size:14px; color:var(--muted); margin:0 0 10px; }

  .play { flex:0 0 auto; width:40px; height:40px; border-radius:50%; border:1px solid var(--line); background:var(--accentbg); color:var(--accent); font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; }

  .txt { flex:1 1 auto; min-width:0; }

  .ph { font-size:13px; color:var(--green); font-style:italic; }
  .en { font-size:13px; color:var(--muted); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:8px; margin:10px 0; }

  .cell .ph { font-size:11px; }

  .example { background:#eefaf3; border:1px solid #bfe6cf; border-radius:10px; padding:10px 12px; font-size:13.5px; color:#155c37; margin:10px 0; }
  .warn { background:#fdeceb; border:1px solid #f2c4c1; border-radius:10px; padding:10px 12px; font-size:13.5px; color:#8d2a25; margin:12px 0; }
  .source { background:#f4f2ee; border:1px solid #d8d2c6; border-left:4px solid var(--muted); border-radius:10px; padding:12px 14px; font-size:13.5px; color:#4a463e; margin:12px 0; }

  .conjt { width:100%; border-collapse:collapse; margin:10px 0; font-size:14px; }

  .conjt th { background:var(--accentbg); color:var(--accent); }
  .riddle { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin:8px 0; }
  .riddle .prompt { font-size:15px; margin-bottom:8px; font-weight:600; }
  .riddle .btns { display:flex; gap:8px; flex-wrap:wrap; }
  .riddle .btns button { border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:8px; padding:7px 14px; font-size:14px; cursor:pointer; }
  .riddle .btns button:hover { border-color:var(--accent); }
  .riddle .fb { font-size:13px; margin-top:8px; }
  .riddle .fb.ok { color:#155c37; } .riddle .fb.bad { color:#a33; }
  .fillrow { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin:8px 0; }
  .fillrow .sent { font-size:15px; margin-bottom:8px; }
  .fillrow input { border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-size:14px; width:200px; }
  .fillrow button { border:1px solid var(--accent); background:var(--accent); color:#fff; border-radius:8px; padding:6px 12px; font-size:13px; cursor:pointer; margin-left:8px; }
  .fillrow .fb { font-size:13px; margin-top:8px; }
  .fillrow .fb.ok { color:#155c37; } .fillrow .fb.bad { color:#a33; }
  .quizbox { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin:14px 0; }
  .quizbtn { border:1px solid var(--accent); background:var(--accent); color:#fff; border-radius:999px; padding:9px 16px; font-size:14px; cursor:pointer; }
  .quizarea { margin-top:12px; }
  .quizprog { font-size:12px; color:var(--muted); margin-bottom:8px; }
  .quizfr { font-size:17px; font-weight:600; margin-bottom:10px; }
  .quizopt { display:block; width:100%; text-align:left; border:1px solid var(--line); background:#fff; border-radius:10px; padding:9px 12px; margin:6px 0; font-size:14px; cursor:pointer; }
  .quizopt:hover { border-color:var(--accent); }

  .quizopt.wrong { background:#fdeceb; border-color:#d9534f; color:#a33; }
  .quizresult { font-size:15px; font-weight:600; margin:10px 0; }
  .quizretry { border:1px solid var(--line); background:#fff; border-radius:999px; padding:7px 14px; font-size:13px; cursor:pointer; }
  .pending { background:#f4f2ee; border:1px dashed #c9c4b8; border-radius:10px; padding:10px 12px; font-size:13px; color:var(--muted); margin:12px 0; }
  .reading { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin:10px 0; }
  .reading p { margin:0 0 10px; }

  .tkbox { background:var(--card); border:2px solid var(--accent); border-radius:14px; padding:14px 16px; margin:0 0 22px; }
  .tkhead { font-size:17px; color:var(--accent); margin-bottom:10px; }
  .tktodo { background:var(--accentbg); border-radius:10px; padding:12px 14px; font-size:14px; line-height:1.6; margin-bottom:14px; }
  .tktab { width:100%; border-collapse:collapse; font-size:13px; }
  .tktab th { text-align:center; padding:6px 4px; border-bottom:2px solid var(--line); font-size:12px; color:var(--muted); font-weight:600; }
  .tktab th span { font-weight:400; font-size:10px; }
  .tktab td { padding:4px; border-bottom:1px solid var(--line); text-align:center; }
  .tktab td.nm { text-align:left; font-size:13px; }
  .tkb { font-size:11px; padding:4px 8px; min-width:52px; border:1px solid var(--line); background:var(--bg); color:var(--muted); border-radius:6px; cursor:pointer; }
  .tkb.done { background:var(--green); color:#fff; border-color:var(--green); font-weight:600; }
  .tktab td.st { font-size:12px; color:var(--muted); white-space:nowrap; }
  .tktab td.st.ok { color:var(--green); font-weight:600; }
  .tktab td.st.mid { color:var(--accent); }
  .tktab td.st.warn { color:#b45309; font-weight:600; }
  .tkfoot { margin-top:10px; font-size:12px; color:var(--muted); display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .tkreset { font-size:12px; padding:4px 10px; border:1px solid var(--line); background:var(--bg); color:var(--muted); border-radius:6px; cursor:pointer; }
</style>

<script>




let rate = 1, frVoice = null;
function pickVoice(){
  const v = speechSynthesis.getVoices();
  frVoice = v.find(x=>/fr[-_]FR/i.test(x.lang)) || v.find(x=>/^fr/i.test(x.lang)) || null;
  const s = document.getElementById('voiceStatus');
  if (frVoice) s.textContent = "\u{1F50A} " + frVoice.name;
  else if (v.length) s.textContent = "⚠ no French voice — see Cours 1 page";
}
speechSynthesis.onvoiceschanged = pickVoice; pickVoice();
function utter(text){
  const u = new SpeechSynthesisUtterance(String(text).replace(/\s+([!?])/g,'$1').replace(/___/g,''));
  u.lang='fr-FR'; if(frVoice) u.voice=frVoice; u.rate=(r||rate); return u;
}
function speak(text, r){ speechSynthesis.cancel(); speechSynthesis.speak(utter(text)); }

function makeRow(fr, ph, en){
  const row=document.createElement('div'); row.className='row';
  const btn=document.createElement('button'); btn.className='play'; btn.textContent='▶';
  const txt=document.createElement('div'); txt.className='txt';
  txt.innerHTML='<div class="fr"></div>'+(ph?'<div class="ph"></div>':'')+(en?'<div class="en"></div>':'');
  txt.querySelector('.fr').textContent=fr;
  if(ph) txt.querySelector('.ph').textContent=ph;
  if(en) txt.querySelector('.en').textContent=en;
  btn.onclick=()=>speak(fr); txt.querySelector('.fr').onclick=()=>speak(fr);
  row.appendChild(btn); row.appendChild(txt);
  return row;
}

const content = document.getElementById('content');
const GLOBAL_VOCAB = [];
/* ===== helpers for this page ===== */
function h2(t){ const e=document.createElement('h2'); e.textContent=t; content.appendChild(e); }
function h3(t){ const e=document.createElement('h3'); e.className='sub2'; e.textContent=t; content.appendChild(e); }
function lead(t){ const e=document.createElement('p'); e.className='lead'; e.innerHTML=t; content.appendChild(e); }
function note(t){ const e=document.createElement('div'); e.className='note'; e.innerHTML=t; content.appendChild(e); }
function ex(t){ const e=document.createElement('div'); e.className='example'; e.innerHTML=t; content.appendChild(e); }
function warn(t){ const e=document.createElement('div'); e.className='warn'; e.innerHTML=t; content.appendChild(e); }
function src(t){ const e=document.createElement('div'); e.className='source'; e.innerHTML=t; content.appendChild(e); }
function rows(list){ list.forEach(([fr,ph,en])=>{ content.appendChild(makeRow(fr,ph,en)); GLOBAL_VOCAB.push({fr:fr,en:en}); }); }
function grid(list){
  const g=document.createElement('div'); g.className='grid';
  list.forEach(([fr,ph])=>{
    const c=document.createElement('div'); c.className='cell';
    c.innerHTML='<div class="fr"></div><div class="ph"></div>';
    c.querySelector('.fr').innerHTML=fr; c.querySelector('.ph').innerHTML=ph;
    const plain=String(fr).replace(/<[^>]*>/g,'').replace(/\s*—.*$/,'').trim();
    c.onclick=()=>speak(plain); g.appendChild(c);
  });
  content.appendChild(g);
}
function table(head, body){
  const t=document.createElement('table'); t.className='conjt';
  let html='<tr>'+head.map(h=>'<th>'+h+'</th>').join('')+'</tr>';
  body.forEach(r=>{ html+='<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>'; });
  t.innerHTML=html; content.appendChild(t);
}
function fill(items){
  items.forEach(it=>{
    const d=document.createElement('div'); d.className='fillrow';
    const s=document.createElement('div'); s.className='sent'; s.innerHTML=it.s;
    const inp=document.createElement('input'); inp.placeholder='...';
    const btn=document.createElement('button'); btn.textContent='Check';
    const fb=document.createElement('div'); fb.className='fb';
    function check(){
      const v=inp.value.trim().toLowerCase().replace(/\s+/g,' ').replace(/[.?!]$/,'');
      const ok=it.a.some(a=>a.toLowerCase()===v);
      if(ok){ fb.className='fb ok'; fb.innerHTML='✓ '+it.a[0]+' — '+it.why; speak(it.a[0]); }
      else { fb.className='fb bad'; fb.innerHTML='✗ Answer: <b>'+it.a[0]+'</b> — '+it.why; }
    }
    btn.onclick=check;
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter') check(); });
    d.appendChild(s);
    const line=document.createElement('div'); line.appendChild(inp); line.appendChild(btn);
    d.appendChild(line);
    if(it.en){ const t=document.createElement('div'); t.className='en'; t.style.marginTop='6px'; t.textContent=it.en; d.appendChild(t); }
    d.appendChild(fb);
    content.appendChild(d);
  });
}
function mcq(items){
  items.forEach(it=>{
    const d=document.createElement('div'); d.className='riddle';
    const p=document.createElement('div'); p.className='prompt'; p.innerHTML=it.q;
    const b=document.createElement('div'); b.className='btns';
    const fb=document.createElement('div'); fb.className='fb';
    it.opts.forEach((o,i)=>{
      const btn=document.createElement('button'); btn.textContent=o;
      btn.onclick=()=>{
        if(i===it.a){ fb.className='fb ok'; fb.innerHTML='✓ '+o+' — '+it.why; speak(o); }
        else { fb.className='fb bad'; fb.innerHTML='✗ The answer is <b>'+it.opts[it.a]+'</b> — '+it.why; }
      };
      b.appendChild(btn);
    });
    d.appendChild(p); d.appendChild(b); d.appendChild(fb);
    content.appendChild(d);
  });
}


/* ===== 1 ===== */
function fillx(list){ fill(list.map(x=>({s:x[0], a:[x[1]], en:x[2]||'', why:x[3]||('Réponse : <b>'+x[1]+'</b>')}))); }
function mcqx(list){ mcq(list.map(x=>({q:x[0], opts:x[1], a:x[2], why:x[3]||''}))); }

function read(paras){
  const d=document.createElement('div'); d.className='reading';
  paras.forEach(t=>{
    const el=document.createElement('p'); el.innerHTML=t; el.style.cursor='pointer';
    const plain=String(t).replace(/<[^>]*>/g,'');
    el.onclick=()=>speak(plain);
    d.appendChild(el);
  });
  content.appendChild(d);
}

function dict(items){
  items.forEach((it,n)=>{
    const d=document.createElement('div'); d.className='fillrow';
    const top=document.createElement('div'); top.className='sent';
    top.innerHTML='<b>'+(n+1)+'.</b> Écoutez, puis écrivez ce que vous entendez. <i>(Listen, then write what you hear.)</i>';
    const bar=document.createElement('div'); bar.style.cssText='display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0';
    const pb=document.createElement('button'); pb.textContent='▶ Écouter'; pb.onclick=()=>speak(it.fr);
    const sb=document.createElement('button'); sb.textContent='▶ Lentement'; sb.onclick=()=>speak(it.fr,0.55);
    const inp=document.createElement('input'); inp.placeholder='Écrivez ici…'; inp.style.flex='1';
    const cb=document.createElement('button'); cb.textContent='Vérifier';
    const fb=document.createElement('div'); fb.className='fb';
    function norm(s){ return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim(); }
    cb.onclick=()=>{
      if(norm(inp.value)===norm(it.fr)){ fb.className='fb ok'; fb.innerHTML='✓ <b>'+it.fr+'</b><br>'+(it.en||'')+(it.why?'<br><i>'+it.why+'</i>':''); }
      else { fb.className='fb bad'; fb.innerHTML='✗ Réponse : <b>'+it.fr+'</b><br>'+(it.en||'')+(it.why?'<br><i>'+it.why+'</i>':''); }
    };
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter') cb.onclick(); });
    bar.appendChild(pb); bar.appendChild(sb); bar.appendChild(inp); bar.appendChild(cb);
    d.appendChild(top); d.appendChild(bar); d.appendChild(fb);
    content.appendChild(d);
  });
}

h2('0 · Avant la liste : comment choisir');
warn("<b>LA RÈGLE DES 50–90 % — appliquez-la à tout ce qui suit.</b><br><br>Une ressource est au bon niveau pour vous si vous en comprenez <b>entre 50 et 90 %</b> sans aide.<br><br>· <b>Moins de 50 %</b> → trop dur. Vous ne devinez plus, vous subissez. Redescendez d’un niveau <u>sans hésiter</u> — il n’y a aucune honte à réécouter de l’A2 au mois 6.<br>· <b>Plus de 90 %</b> → trop facile. C’est agréable et ça ne construit rien. Montez.<br>· <b>Entre les deux</b> → c’est là que le travail se fait.<br><br>Soyez honnête dans l’estimation : « j’ai saisi le sujet » n’est pas « j’ai compris 70 % ».");
note("<b>Et une mise en garde honnête sur cette page.</b><br><br>Je n’ai pas pu ouvrir et tester chacun de ces sites un par un — certaines adresses sont bloquées pour moi. Je les ai repérées via des guides de préparation et, pour deux d’entre elles, dans le <b>manuel officiel du candidat TCF</b>, qui les recommande nommément.<br><br>Les noms et les niveaux sont fiables. <b>Vérifiez vous-même</b> que le contenu correspond à votre niveau et que les offres gratuites n’ont pas changé avant d’en faire une habitude. Et méfiez-vous systématiquement des sites payants qui promettent le NCLC 7 en trois mois.");

h2('1 · Les trois essentielles — à faire tous les jours');
warn("<b>Si vous ne retenez que trois choses de cette page, ce sont celles-là.</b><br><br><b>1 · RFI — Journal en français facile</b> &nbsp;<i>francaisfacile.rfi.fr</i><br>Un bulletin d’actualité de <b>dix minutes, tous les jours, avec transcription gratuite</b>, pitché autour du B1. C’est le cœur de votre Trajet B. <b>Le manuel du candidat TCF le recommande explicitement.</b> Téléchargeable pour l’écoute hors ligne — préparez-le la veille en Wi-Fi.<br><br><b>2 · TV5Monde — Apprendre le français</b> &nbsp;<i>apprendre.tv5monde.com</i><br>Exercices vidéo <b>classés par niveau A1 à B2</b>, correction automatique, format proche de l’examen. <b>Également recommandé par le manuel du candidat</b>, et il existe une section dédiée au TCF.<br><br><b>3 · France Éducation International — exemples d’items officiels</b><br>Les seuls exercices écrits par l’organisme qui conçoit le test. Peu nombreux. <b>Gardez-en pour vos examens blancs des mois 6 et 9</b> plutôt que de tout brûler maintenant — une fois faits, ils ne sont plus un test.");

h2('2 · Écoute — l’échelle, du plus simple au plus dur');
lead('Montez quand vous atteignez 70 % sans transcription. Pas avant.');
table(['Niveau','Ressource','Format','Transcription'],[

note("<b>Pourquoi la transcription compte autant.</b><br><br>Sans transcription, l’écoute reste de l’exposition : vous entendez du français et vous ne savez jamais <u>ce que vous avez raté</u>.<br><br>Avec transcription, vous pouvez faire la troisième passe — celle qui compte : écouter, puis lire, puis surligner tout ce que vous n’aviez pas entendu. C’est là que vous découvrez <u>pourquoi</u> vous n’aviez pas entendu : mot inconnu, liaison, ou élision. Trois causes, trois remèdes.<br><br><b>Donc : privilégiez toujours une ressource avec transcription</b>, même si le contenu vous intéresse moins.");

h2('4 · Lecture — là où se construit le vocabulaire');
warn("<b>Le chiffre qui explique pourquoi la lecture n’est pas optionnelle.</b><br><br>Il faut environ <b>3 000 à 5 000 mots</b> pour lire confortablement au niveau B2. <i>(Chiffre courant dans la littérature pédagogique ; je ne l’ai pas vérifié à la source primaire.)</i><br><br>Le livre vous en donnera peut-être <b>1 500 à 2 000</b>. Le reste vient du <b>volume</b> — et il n’existe aucune liste qui remplace ça. On n’apprend pas 3 000 mots par cœur ; on les rencontre.<br><br><b>Dose : 15 à 20 minutes par jour.</b> C’est peu et c’est non négociable à partir du mois 3.");

note("<b>Pourquoi 1jour1actu est particulièrement bon pour vous.</b><br><br>C’est de l’actualité réelle, écrite par des journalistes, mais destinée à des enfants français de 8 à 12 ans. Résultat : <b>la syntaxe est authentique</b> (contrairement aux textes de manuel, qui sont fabriqués) mais le <b>vocabulaire est volontairement limité</b>, et chaque article fait 200 à 300 mots.<br><br>C’est exactement le profil dont vous avez besoin entre A2 et B1 : du français vrai, à une densité lexicale que vous pouvez absorber.");
h3('La méthode de lecture — sinon ça ne sert à rien');
ex("<b>Ne lisez pas en cherchant chaque mot inconnu. Vous n’iriez nulle part.</b><br><br><b>1 ·</b> Lisez l’article en entier, <u>sans dictionnaire</u>. Acceptez de ne pas tout comprendre.<br><b>2 ·</b> Relisez et <b>soulignez seulement les mots qui bloquent le sens</b> — pas tous les inconnus, seulement ceux sans lesquels vous ne comprenez pas la phrase. En général : trois à cinq par article.<br><b>3 ·</b> Cherchez ces trois à cinq-là.<br><b>4 ·</b> Pour chacun, <b>écrivez une phrase à vous</b>, sur votre vie. Pas la phrase de l’article.<br><b>5 ·</b> Relisez l’article une dernière fois, à voix haute.<br><br><b>Cinq mots par jour × 200 jours = 1 000 mots</b>, appris en contexte et ancrés dans des phrases qui vous concernent. C’est comme ça qu’on comble l’écart, pas en apprenant des listes.");

h2('5 · Parler à des humains — le point qui décide');
warn("<b>C’est la ressource la plus importante de cette page, et la seule qui demande de sortir de chez soi — au moins virtuellement.</b><br><br>Vous pouvez atteindre un très bon niveau de compréhension tout seul. <b>Vous ne pouvez pas atteindre NCLC 7 en expression orale tout seul.</b> Les mots ne sortent avec fluidité que quand quelqu’un attend la réponse.<br><br><b>Dose : 30 minutes par semaine minimum, à partir du mois 5</b>, <u>en plus</u> de vos cours.");

note("<b>Comment utiliser une séance de 30 minutes pour qu’elle serve à l’examen :</b><br><br>· <b>5 min</b> — votre présentation de 2 minutes, comme à la tâche 1. Demandez qu’on vous interrompe avec des questions.<br>· <b>10 min</b> — un jeu de rôle où <u>vous</u> posez les questions : réserver, demander un renseignement, régler un problème. C’est la tâche 2, celle où les candidats bloquent.<br>· <b>10 min</b> — un des dix thèmes de la tâche 3, en monologue, sans préparation.<br>· <b>5 min</b> — demandez à votre interlocuteur : <b>quelles sont mes trois erreurs les plus fréquentes ?</b><br><br>Cette dernière question vaut à elle seule le prix de la séance. Vous ne pouvez pas entendre vos propres erreurs récurrentes ; quelqu’un d’autre les entend en cinq minutes.");

h2('7 · Ce qu’il faut éviter');
warn("<b>1 · Les applis à séries et à points</b> (Duolingo et compagnie). Utiles pour l’habitude quotidienne, très insuffisantes pour un B2. Si ça vous amuse, gardez-le — mais <u>en plus</u>, jamais à la place, et ne comptez pas ces minutes dans vos 16 heures.<br><br><b>2 · Les sites payants qui promettent le NCLC 7 en trois mois.</b> Ce n’est pas possible depuis l’A1, et ils le savent.<br><br><b>3 · Les listes de « 1 000 mots essentiels ».</b> Apprises hors contexte, elles ne ressortent pas en parlant.<br><br><b>4 · Les vidéos YouTube « apprendre le français en dormant ».</b> Non.<br><br><b>5 · Collectionner les ressources au lieu de les utiliser.</b> C’est le piège de cette page. <b>Trois ressources utilisées tous les jours battent quinze ressources ouvertes une fois.</b> Choisissez-en trois et fermez cet onglet.");
